  renderCalendar() {
    const container = document.getElementById('calendarContainer');
    if (this.columns.length === 0) {
      container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--ink-2);">暂无类别，请先添加至少一个类别</div>';
      return;
    }

    const today = new Date();
    const todayDay = today.getDate();
    const todayMonth = today.getMonth() + 1;
    const todayYear = today.getFullYear();
    const isCurrentMonth = (this.year === todayYear && this.month === todayMonth);

    // Get first day of month (0=Sun, 1=Mon, ...)
    const firstDay = new Date(this.year, this.month - 1, 1).getDay();
    // Convert to Monday-start: 0=Mon, 6=Sun
    const startOffset = firstDay === 0 ? 6 : firstDay - 1;

    const daysInMonth = new Date(this.year, this.month, 0).getDate();

    // Build calendar cells
    let cells = '';

    // Previous month trailing days
    const prevMonthDays = new Date(this.year, this.month - 1, 0).getDate();
    for (let i = startOffset - 1; i >= 0; i--) {
      const d = prevMonthDays - i;
      cells += `<div class="calendar-cell other-month"><span class="cal-cell-date">${d}</span></div>`;
    }

    // Current month days
    for (let d = 1; d <= daysInMonth; d++) {
      const dayOfWeek = new Date(this.year, this.month - 1, d).getDay();
      const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
      const isToday = isCurrentMonth && d === todayDay;
      const isPast = isCurrentMonth ? d <= todayDay : (this.year < todayYear || (this.year === todayYear && this.month < todayMonth));
      const isFuture = !isPast && !isToday;

      const dayTotal = this.getDayTotal(d);
      const hasNotes = this.cellNotes[String(d)] && Object.keys(this.cellNotes[String(d)]).length > 0;
      const isNoSpend = isPast && dayTotal === 0;

      let cls = 'calendar-cell';
      if (isWeekend) cls += ' cal-cell-weekend';
      if (isToday) cls += ' today';
      if (isNoSpend) cls += ' no-spend';
      else if (dayTotal > 0) cls += ' has-spend';
      if (isFuture) cls += ' future';

      let content = `<span class="cal-cell-date">${d}</span>`;
      if (isNoSpend) {
        content += '<span class="cal-cell-badge">✨零花销</span>';
      } else if (dayTotal > 0) {
        content += `<span class="cal-cell-amount">¥${this._money(dayTotal)}</span>`;
      }
      const noteDot = hasNotes ? '<span class="cal-cell-note-dot"></span>' : '';
      const todayBadge = isToday ? '<span class="cal-cell-today-badge">今天</span>' : '';

      cells += `<div class="${cls}" onclick="${isFuture ? '' : `app.openDayEntry(${d})`}">${todayBadge}${noteDot}${content}</div>`;
    }

    // Next month leading days to fill last row
    const totalCells = startOffset + daysInMonth;
    const remaining = (7 - (totalCells % 7)) % 7;
    for (let d = 1; d <= remaining; d++) {
      cells += `<div class="calendar-cell other-month"><span class="cal-cell-date">${d}</span></div>`;
    }

    container.innerHTML = `
      <div class="calendar-wrap">
        <div class="calendar-weekdays">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div class="calendar-grid">${cells}</div>
      </div>
    `;
  }

  renderTable() {
    const container = document.getElementById('calendarContainer');
    if (this.columns.length === 0) {
      container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--ink-2);">暂无类别，请先添加至少一个类别</div>';
      return;
    }

    // Build column header
    let thead = '<thead><tr><th class="date-col">日期</th>';
    this.columns.forEach(c => {
      const budgetNote = c.budget ? `<br><span style="font-weight:400;font-size:10px;">预算${c.budget}</span>` : '';
      thead += `<th>${this._escapeHtml(c.name)}${budgetNote}</th>`;
    });
    thead += '<th style="width:60px;text-align:right;">日计</th><th style="width:54px;">快录</th></tr></thead>';

    // Build body
    let tbody = '<tbody>';
    for (let d = 1; d <= 31; d++) {
      const date = new Date(this.year, this.month - 1, d);
      const dayOfWeek = date.getDay();
      const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
      const isNoSpend = this.isNoSpendDay(d);
      let rowClass = isWeekend ? 'weekend' : '';
      if (isNoSpend) rowClass += ' no-spend';

      tbody += `<tr class="${rowClass}" id="dayRow_${d}">`;
      tbody += `<td>${this.month}/${d} ${this._dayOfWeek(d)}</td>`;

      this.columns.forEach(c => {
        const val = this.entries[String(d)]?.[c.key] || '';
        const dispVal = this._numDisp(val);          // 0 视为空（显示与交互一致）
        const budget = c.budget || Infinity;
        const numVal = parseFloat(val);
        const overClass = (!isNaN(numVal) && budget > 0 && numVal > budget) ? ' over-budget' : '';
        const hasValClass = dispVal !== '' ? ' has-value' : '';
        const cellNote = this.cellNotes[String(d)]?.[c.key];
        const noteDot = cellNote ? '<span class="cell-note-dot" title="' + this._escapeHtml(cellNote) + '"></span>' : '';

        tbody += `<td>
          <div class="cell-wrap">
            <input class="cell-input${overClass}${hasValClass}" type="number" inputmode="decimal"
              id="cell_${d}_${c.key}" value="${dispVal}" step="0.01"
              onchange="app.onCellChange(${d},'${c.key}')"
              onfocus="app.numFocus(this)" onblur="app.numBlur(this)">
            ${noteDot}
          </div>
        </td>`;
      });

      const dayTotal = this.getDayTotal(d);
      const hasData = this.columns.some(c => {
        const v = this.entries[String(d)]?.[c.key];
        return v && v !== '';
      });
      const hasNotes = this.cellNotes[String(d)] && Object.keys(this.cellNotes[String(d)]).length > 0;
      tbody += `<td class="row-total" id="rowTotal_${d}">${dayTotal ? this._money(dayTotal) : ''}</td>`;
      tbody += `<td><button class="quick-entry-btn${hasData ? ' has-data' : ''}" onclick="app.openDayEntry(${d})">${hasData ? (hasNotes ? '📝' : '✏️') : '+'} 快录</button></td>`;
      tbody += '</tr>';
    }
    tbody += '</tbody>';

    // Build totals row
    let tfoot = '<tfoot><tr class="totals-row"><td>合计</td>';
    this.columns.forEach(c => {
      const total = this.getColTotal(c.key);
      tfoot += `<td class="total-val">${total ? this._money(total) : '0'}</td>`;
    });
    const grandTotal = this.getGrandTotal();
    tfoot += `<td class="total-val">${this._money(grandTotal)}</td><td></td>`;
    tfoot += '</tr></tfoot>';

    container.innerHTML = `<div class="table-wrap"><table>${thead}${tbody}${tfoot}</table></div>`;
  }

  // ══════════════════════════════════════════════════
  //  提醒与待办（未来财务事项时间轴）
  //  数据存全局键 ledger_todos_v1，跨月持续，不按月
  // ══════════════════════════════════════════════════
  get todosKey() { return 'ledger_todos_v1'; }

  loadTodos() {
    const raw = localStorage.getItem(this.todosKey);
    let data = null;
    if (raw) { try { data = JSON.parse(raw); } catch(e) {} }
    this.todos = (data && Array.isArray(data.todos)) ? data.todos : [];
  }

  saveTodos() {
    localStorage.setItem(this.todosKey, JSON.stringify({ todos: this.todos }));
    this.updateSaveStatus();
    this._scheduleAutoBackup();
    this._scheduleCloudPush();
  }

  // 到期日：周期性事项按月换算（2 月 31 号自动取当月最后一天）
  _todoDueDate(todo, year, month) {
    if (todo.recurring && todo.recurring.dayOfMonth) {
      const dim = new Date(year, month, 0).getDate();
      const day = Math.min(todo.recurring.dayOfMonth, dim);
      return new Date(year, month - 1, day);
    }
    if (todo.dueDate) {
      const p = String(todo.dueDate).split('-');
      if (p.length === 3) return new Date(+p[0], +p[1] - 1, +p[2]);
    }
    return null;
  }

  // 是否已完成：周期性按月记 doneMonths，一次性看 status
  _todoIsDone(todo, year, month) {
    if (todo.recurring) {
      const mk = `${year}-${String(month).padStart(2,'0')}`;
      return Array.isArray(todo.doneMonths) && todo.doneMonths.includes(mk);
    }
    return todo.status === 'done';
  }

  // 剩余天数（负 = 已逾期）
  _todoDaysLeft(todo) {
    const due = this._todoDueDate(todo, this.year, this.month);
    if (!due) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const d = new Date(due); d.setHours(0,0,0,0);
    return Math.round((d - today) / 86400000);
  }

  renderTodos() {
    const alertEl = document.getElementById('todoAlert');
    const listEl  = document.getElementById('todoList');
    if (!alertEl || !listEl) return;

    const active = this.todos.filter(t => t.status !== 'dropped');
    const dueSoon = [], overdue = [];
    active.forEach(t => {
      if (this._todoIsDone(t, this.year, this.month)) return;
      const left = this._todoDaysLeft(t);
      if (left === null) return;
      if (left < 0) overdue.push(t);
      else if (left <= (parseInt(t.remindDays, 10) || 0)) dueSoon.push(t);
    });

    // ── 顶部提醒横幅（打开即见） ──
    if (overdue.length === 0 && dueSoon.length === 0) {
      alertEl.innerHTML = active.length === 0 ? '' :
        `<div class="todo-alert calm"><span>✅</span><span>近几天没有待办，${active.length} 项都在静静等着。</span></div>`;
    } else {
      const parts = [];
      if (dueSoon.length) parts.push(`<span class="ta-num">${dueSoon.length}</span><span> 项快到期</span>`);
      if (overdue.length)  parts.push(`<span class="ta-num">${overdue.length}</span><span> 项已逾期</span>`);
      alertEl.innerHTML = `<div class="todo-alert"><span>🔔</span>${parts.join('<span style="opacity:.4;"> · </span>')}</div>`;
    }

    // ── 完整列表 ──
    if (active.length === 0) {
      listEl.innerHTML = `<div class="todo-empty">还没有待办事项。<br>点右上「＋ 添加事项」，把还款日、报销、发薪日记下来，到时候就能想起来 🌿</div>`;
      return;
    }

    const ordered = active.slice().sort((a, b) => {
      const da = this._todoDaysLeft(a), db = this._todoDaysLeft(b);
      if (da === null) return 1;
      if (db === null) return -1;
      return da - db;
    });

    let html = '';
    ordered.forEach(t => {
      const meta  = TODO_TYPES[t.type] || TODO_TYPES.verify;
      const left  = this._todoDaysLeft(t);
      const done  = this._todoIsDone(t, this.year, this.month);
      const dim   = new Date(this.year, this.month, 0).getDate();
      const dueTxt = t.recurring
        ? `每月 ${t.recurring.dayOfMonth} 号`
        : (t.dueDate || '未定日期');

      let agingCls = '', agingTxt = '';
      if (!done && left !== null && left < 0) {
        const od = -left;
        if (od <= 7)       { agingCls = 'overdue-1'; agingTxt = `<span class="todo-aging a1">逾期 ${od} 天 · 查一下</span>`; }
        else if (od <= 30) { agingCls = 'overdue-2'; agingTxt = `<span class="todo-aging a2">逾期 ${od} 天 · 该问了</span>`; }
        else               { agingCls = 'overdue-3'; agingTxt = `<span class="todo-aging a3">逾期 ${od} 天 · 再拖就黄了</span>`; }
      }
      if (done) agingCls = 'done';

      const amtCls = meta.direction === 'out' ? 'out' : (meta.direction === 'in' ? 'in' : '');
      const amtVal = parseFloat(t.amount);
      const amtTxt = (!isNaN(amtVal) && amtVal > 0)
        ? `<span class="todo-amount ${amtCls}">${meta.direction === 'out' ? '-' : '+'}¥${this._money(amtVal)}</span>` : '';

      html += `
        <div class="todo-item ${agingCls}">
          <div class="todo-main">
            <div class="todo-title">${meta.icon} ${this._escapeHtml(t.title)}${done ? ' <span style="color:var(--good);">✔ 已完成</span>' : ''}</div>
            <div class="todo-meta">
              <span class="todo-badge" style="background:${meta.color};">${meta.label}</span>
              <span>📅 ${dueTxt}</span>
              ${amtTxt}
              ${(!done && left !== null && left >= 0) ? `<span style="color:var(--ink-2);">还有 ${left} 天</span>` : ''}
              ${agingTxt}
              ${t.recurring ? '<span style="opacity:.6;">· 每月重复</span>' : ''}
            </div>
            ${t.nextAction ? `<div class="todo-action">👉 ${this._escapeHtml(t.nextAction)}</div>` : ''}
            ${t.voucher ? `<div class="todo-meta" style="margin-top:3px;">📎 凭证：${this._escapeHtml(t.voucher)}</div>` : ''}
          </div>
          <div class="todo-btns">
            ${done
              ? `<button class="todo-btn ghost" onclick="app.undoTodo('${t.id}')">撤销</button>`
              : `<button class="todo-btn" onclick="app.completeTodo('${t.id}')">完成</button>`}
            <button class="todo-btn ghost" onclick="app.editTodo('${t.id}')">改</button>
            <button class="todo-btn danger" onclick="app.deleteTodo('${t.id}')">删</button>
          </div>
        </div>`;
    });
    listEl.innerHTML = html;
  }

  // ── 待办：添加 / 编辑表单 ──

  saveTodoForm() {
    const title = (document.getElementById('tf_title').value || '').trim();
    if (!title) { this.showToast('请先填写标题'); return; }
    const type   = document.getElementById('tf_type').value;
    const amount = document.getElementById('tf_amount').value;
    const mode   = document.getElementById('tf_mode').value;
    const day    = parseInt(document.getElementById('tf_day').value, 10);
    const date   = document.getElementById('tf_date').value;
    const remind = parseInt(document.getElementById('tf_remind').value, 10);
    const action = (document.getElementById('tf_action').value || '').trim();
    const voucher= (document.getElementById('tf_voucher').value || '').trim();
    const col    = document.getElementById('tf_col').value;

    if (mode === 'recurring' && (!day || day < 1 || day > 31)) { this.showToast('请填写 1–31 之间的日期'); return; }
    if (mode === 'once' && !date) { this.showToast('请选择具体日期'); return; }

    const payload = {
      title, type,
      amount: amount === '' ? '' : amount,
      recurring: mode === 'recurring' ? { dayOfMonth: day } : null,
      dueDate:   mode === 'once' ? date : null,
      remindDays: isNaN(remind) ? 0 : remind,
      nextAction: action,
      voucher,
      linkedCol: col || '',
    };

    if (this.editingTodoId) {
      const t = this.todos.find(x => x.id === this.editingTodoId);
      if (t) Object.assign(t, payload);
      this.showToast('已保存修改');
    } else {
      payload.id = 'todo_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
      payload.status = 'pending';
      payload.doneMonths = [];
      this.todos.push(payload);
      this.showToast('✅ 已添加，到点会提醒你');
    }
    this.editingTodoId = null;
    this.saveTodos();
    this.toggleTodoForm();
    this.renderTodos();
  }

  editTodo(id) {
    this.editingTodoId = id;
    if (!this.todoFormOpen) this.toggleTodoForm();
    else this.renderTodoForm();
  }

  deleteTodo(id) {
    const t = this.todos.find(x => x.id === id);
    if (!t) return;
    if (!confirm(`确定删除「${t.title}」？`)) return;
    this.todos = this.todos.filter(x => x.id !== id);
    this.saveTodos();
    this.renderTodos();
    this.showToast('已删除');
  }

  // 完成（核销）：周期性按月份记，且支出类可自动记一笔账
  completeTodo(id) {
    const t = this.todos.find(x => x.id === id);
    if (!t) return;
    const mk = `${this.year}-${String(this.month).padStart(2,'0')}`;
    if (t.recurring) {
      if (!Array.isArray(t.doneMonths)) t.doneMonths = [];
      if (!t.doneMonths.includes(mk)) t.doneMonths.push(mk);
    } else {
      t.status = 'done';
    }

    // 支出类 + 选了关联类别 + 当前月 → 自动记一笔支出
    const meta = TODO_TYPES[t.type] || TODO_TYPES.verify;
    const amt  = parseFloat(t.amount);
    const now  = new Date();
    const isCurrentMonth = (this.year === now.getFullYear() && this.month === now.getMonth() + 1);
    if (meta.direction === 'out' && !isNaN(amt) && amt > 0 && t.linkedCol && isCurrentMonth) {
      const key = String(now.getDate());
      if (this.entries[key] && this.columns.some(c => c.key === t.linkedCol)) {
        const cur = parseFloat(this.entries[key][t.linkedCol]) || 0;
        this.entries[key][t.linkedCol] = String(Math.round((cur + amt) * 100) / 100);
        this.saveData();
        this.renderLedger();
        this.renderSummary();
      }
    }
    this.saveTodos();
    this.renderTodos();

    if (meta.direction === 'out') {
      this.showToast(t.linkedCol && isCurrentMonth ? '✅ 已完成，并已记一笔支出' : '✅ 已完成');
    } else {
      this.showToast('✅ 已完成（这笔收入记得记到「本月收入与扣款」里）');
    }
  }

  undoTodo(id) {
    const t = this.todos.find(x => x.id === id);
    if (!t) return;
    const mk = `${this.year}-${String(this.month).padStart(2,'0')}`;
    if (t.recurring) {
      t.doneMonths = (t.doneMonths || []).filter(m => m !== mk);
    } else {
      t.status = 'pending';
    }
    this.saveTodos();
    this.renderTodos();
    this.showToast('已撤销');
  }

  // ── 导出 .ics：借手机系统日历实现「到点真提醒」（零服务器） ──
  exportTodosICS() {
    const active = this.todos.filter(t => t.status !== 'dropped');
    if (active.length === 0) { this.showToast('还没有待办事项'); return; }
    const pad = n => String(n).padStart(2, '0');
    const now = new Date();
    const stamp = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}T000000Z`;
    const esc = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');

    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//月记账本//待办提醒//CN', 'CALSCALE:GREGORIAN'];
    active.forEach(t => {
      const meta = TODO_TYPES[t.type] || TODO_TYPES.verify;
      const amt  = parseFloat(t.amount);
      const amtTxt = (!isNaN(amt) && amt > 0) ? ` ${meta.direction === 'out' ? '-' : '+'}¥${this._money(amt)}` : '';
      const summary = esc(`${meta.icon} ${t.title}${amtTxt}`);
      const desc = esc([t.nextAction, t.voucher ? `凭证：${t.voucher}` : ''].filter(Boolean).join(' / '));

      let dtstart = null, rrule = null;
      if (t.recurring && t.recurring.dayOfMonth) {
        const d = Math.min(t.recurring.dayOfMonth, 28); // 起始用 ≤28，避开 2 月
        dtstart = `DTSTART;VALUE=DATE:${this.year}${pad(this.month)}${pad(d)}`;
        rrule = `RRULE:FREQ=MONTHLY;BYMONTHDAY=${t.recurring.dayOfMonth}`;
      } else {
        const p = String(t.dueDate || '').split('-');
        if (p.length !== 3) return;
        dtstart = `DTSTART;VALUE=DATE:${p[0]}${p[1]}${p[2]}`;
      }
      const rd = parseInt(t.remindDays, 10) || 0;
      lines.push(
        'BEGIN:VEVENT', `UID:${t.id}@ledger`, `DTSTAMP:${stamp}`, dtstart,
        ...(rrule ? [rrule] : []),
        `SUMMARY:${summary}`,
        ...(desc ? [`DESCRIPTION:${desc}`] : []),
        'BEGIN:VALARM', `TRIGGER:${rd > 0 ? `-P${rd}D` : '-PT2H'}`, 'ACTION:DISPLAY', `DESCRIPTION:${summary}`, 'END:VALARM',
        'END:VEVENT'
      );
    });
    lines.push('END:VCALENDAR');

    const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `记账待办_${this.year}${pad(this.month)}.ics`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    this.showToast('📅 已导出，用手机日历打开即可到点提醒');
  }

  // ══════════════════════════════════════════════════
  //  存款与外账（🏦 跨月全局状态，独立键 ledger_assets_v1）
  //  数据不按月存储：存款是持续余额，外账是"我欠别人(owe) / 别人欠我(receive)"双向
  // ══════════════════════════════════════════════════
  get assetsKey() { return 'ledger_assets_v1'; }

  _defaultAssets() {
    return {
      savings: { current:'', target:'', targetName:'', targetWhy:'', monthlyPlan:'' },
      debts: [],           // { id, dir:'owe'|'receive', name, amount, rate, note, cleared, clearedAt }
      repayMonthly: '',    // 每月可用于还账/存款的预算（手填优先，空则用近3月结余估算）
    };
  }

  loadAssets() {
    const raw = localStorage.getItem(this.assetsKey);
    let data = null;
    if (raw) { try { data = JSON.parse(raw); } catch(e) {} }
    const def = this._defaultAssets();
    this.assets = data && typeof data === 'object' ? data : def;
    // 兜底字段
    if (!this.assets.savings || typeof this.assets.savings !== 'object') this.assets.savings = def.savings;
    if (!Array.isArray(this.assets.debts)) this.assets.debts = [];
    this.assets.savings = Object.assign({}, def.savings, this.assets.savings);
    // 归一化每条外账（兼容早期调研用的 type 字段）
    this.assets.debts = this.assets.debts.map(d => ({
      id: d.id || ('d' + Math.random().toString(36).slice(2, 8)),
      dir: (d.dir || d.type || 'owe') === 'receive' ? 'receive' : 'owe',
      name: d.name != null ? String(d.name) : '',
      amount: d.amount != null ? String(d.amount) : '',
      rate: d.rate != null ? String(d.rate) : '',
      cleared: !!d.cleared,
      clearedAt: d.clearedAt || '',
    }));
  }

  saveAssets() {
    this.flushAssetsInput();
    localStorage.setItem(this.assetsKey, JSON.stringify(this.assets));
    this.updateSaveStatus();
    this._scheduleAutoBackup();
    this._scheduleCloudPush();
  }

  // 编辑框失焦前把值写回模型（与记账输入框同一机制）
  flushAssetsInput() {
    const el = document.activeElement;
    if (!el || !el.id) return;
    const fieldMap = { as_cur:'current', as_tgt:'target', as_name:'targetName', as_plan:'monthlyPlan', as_repay:'repayMonthly' };
    if (!(el.id in fieldMap)) return;
    const f = fieldMap[el.id];
    if (f === 'repayMonthly') this.assets.repayMonthly = el.value;
    else this.assets.savings[f] = el.value;
  }

  _assetNum(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }

  // 净资产 = 存款当前 + 别人欠我的 − 我欠别人的
  _netWorth() {
    const sv = this._assetNum(this.assets.savings.current);
    let owe = 0, recv = 0;
    (this.assets.debts || []).forEach(d => {
      if (d.cleared) return;
      const amt = this._assetNum(d.amount);
      if (d.dir === 'owe') owe += amt; else recv += amt;
    });
    return { sv, owe, recv, net: sv + recv - owe };
  }

  updateAssetsTotal() {
    const el = document.getElementById('assetsTotal');
    if (!el) return;
    const { sv, owe, recv } = this._netWorth();
    const hasAny = sv !== 0 || owe !== 0 || recv !== 0;
    const net = sv + recv - owe;
    el.innerHTML = hasAny
      ? `<span class="bt-label">🏦 净资产</span><span class="bt-value" style="color:${net < 0 ? 'var(--danger)' : 'var(--mint-dark)'};">¥${this._money(net)}</span>`
      : `<span class="bt-label">🏦 净资产</span><span class="bt-value">¥0</span>`;
  }

  renderAssets() {
    this.updateAssetsTotal();
    this.renderAssetsSummary();
    this.renderAssetsBody();
  }

  renderAssetsSummary() {
    const el = document.getElementById('assetsSummary');
    if (!el) return;
    const { sv, owe, recv, net } = this._netWorth();
    const cell = (label, val, cls) => `<div class="as-cell"><span class="as-label">${label}</span><span class="as-val ${cls || ''}">${val}</span></div>`;
    el.innerHTML = `
      <div class="assets-summary">
        ${cell('💰 当前存款', sv ? `¥${this._money(sv)}` : '¥0', 'mint')}
        ${cell('🙋 我欠别人的', owe ? `¥${this._money(owe)}` : '¥0', owe ? 'coral' : '')}
        ${cell('🤝 别人欠我的', recv ? `¥${this._money(recv)}` : '¥0', recv ? 'mint' : '')}
        ${cell('🧮 净资产', `¥${this._money(net)}`, net < 0 ? 'coral' : (net > 0 ? 'warn' : ''))}
      </div>`;
  }

  // 近3月平均结余（估算还款/存款节奏用；无历史数据返回 null）
  _avgMonthlySurplus() {
    const months = this.getAllMonthData();   // 从新到旧
    const vals = [];
    months.forEach(m => {
      if (vals.length >= 3) return;
      // 跳过当前月份本身（避免本月数据不完整造成的误导）
      if (m.year === this.year && m.month === this.month) return;
      const d = m.data;
      // 收入合计：用该月自己的 incomeItems（旧数据回退三字段）
      let inc = 0;
      if (Array.isArray(d.incomeItems) && d.incomeItems.length) {
        d.incomeItems.forEach(it => {
          const v = parseFloat(it.amount); if (isNaN(v)) return;
          inc += (it.sign === '-' ? -1 : 1) * v;
        });
      } else {
        const ts = d.trackingSigns || {};
        const s = parseFloat(d.salary), i = parseFloat(d.insurance), h = parseFloat(d.housingFund);
        if (!isNaN(s)) inc += (ts.salary === '-' ? -1 : 1) * s;
        if (!isNaN(i)) inc += (ts.insurance === '-' ? -1 : 1) * i;
        if (!isNaN(h)) inc += (ts.housingFund === '-' ? -1 : 1) * h;
      }
      // 支出合计
      let exp = 0;
      (d.columns || []).forEach(c => { exp += this._getMonthColTotal(d, c.key); });
      // 该月结余
      const bal = inc - exp;
      // 只统计"有记录"的月份（收入或支出非零）
      if (Math.abs(bal) > 0.0001 || exp > 0) vals.push(bal);
    });
    if (!vals.length) return null;
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    return Math.round(avg * 100) / 100;
  }

  // 可支配预算：手填优先，否则近3月平均结余（可能为 0/负/null）
  _monthlyBudget() {
    const manual = this._assetNum(this.assets.repayMonthly);
    if (manual > 0) return manual;
    const avg = this._avgMonthlySurplus();
    if (avg === null) return null;
    return avg > 0 ? avg : 0;
  }

  // 单笔按利率估算需多少月还清（按月迭代）；monthly<=0 返回 null
  _payoffMonths(amount, ratePct, monthly) {
    if (!(amount > 0) || !(monthly > 0)) return null;
    let bal = amount;
    const r = (ratePct || 0) / 100 / 12;
    let m = 0;
    // 兜底：400 个月还没还完视为估算失败（防死循环）
    while (bal > 0.005 && m < 400) {
      bal = bal * (1 + r) - monthly;
      m++;
    }
    return bal <= 0.005 ? m : null;
  }

  // 预计年月（从今天起数 n 个月；n<=0 表示本月内）
  _monthLabel(n) {
    if (n <= 0) return '本月内';
    const now = new Date();
    const d = new Date(now.getFullYear(), now.getMonth() + n, 1);
    return `${d.getFullYear()}年${d.getMonth() + 1}月`;
  }

  // 雪球/雪崩策略排序。default snowball（先清最小的，心理学完成率更高）
  _strategySort(list) {
    return list.slice().sort((a, b) => {
      const ka = parseFloat(a.amount) || 0, kb = parseFloat(b.amount) || 0;
      return ka - kb;
    });
  }

  // 欠款估算：把所有未清 owe 按策略排序，逐笔累计还清月数（先清一笔再滚到下一笔）
  _owePlan() {
    const owes = (this.assets.debts || []).filter(d => d.dir === 'owe' && !d.cleared && (parseFloat(d.amount) || 0) > 0);
    if (!owes.length) return null;
    const monthly = this._monthlyBudget();
    if (monthly === null || monthly <= 0) return { monthly: 0, noBudget: true, impossible: false };
    const sorted = this._strategySort(owes);
    let totalMonths = 0;
    const per = [];
    for (const d of sorted) {
      const m = this._payoffMonths(parseFloat(d.amount) || 0, parseFloat(d.rate) || 0, monthly);
      if (m === null) return { monthly, impossible: true, noBudget: false };
      totalMonths += m;
      per.push({ id: d.id, name: d.name, amount: d.amount, months: m });
    }
    return { monthly, totalMonths, per, impossible: false, noBudget: false };
  }

  // 存款达标估算
  _savePlan() {
    const sv = this.assets.savings;
    const cur = this._assetNum(sv.current);
    const tgt = this._assetNum(sv.target);
    if (tgt <= cur) return { achieved: true };
    const manual = this._assetNum(sv.monthlyPlan);
    const monthly = manual > 0 ? manual : (this._monthlyBudget() || 0);
    if (!(monthly > 0)) return { achieved: false, monthly: 0 };
    const months = Math.ceil((tgt - cur) / monthly);
    return { achieved: false, monthly, months, target: tgt, cur };
  }

  // ── 情绪反馈文案库（v8.14 起卡片内默认不再展示长文案，仅保留供庆祝弹窗/后续复用）──
  // 红线词避开：绝不出现"债务缠身/入不敷出/你还欠…"
  _tone(months, kind) {
    // kind: 'owe' 还账 ｜ 'save' 存款达标
    if (months === null) {
      return kind === 'owe'
        ? '按现在的收支暂时还不上——这不怪你，是数字的问题。要不要先挑最小的一笔，先赢一次？'
        : '暂时还没法按固定节奏存钱。没关系，先记好每一笔，等收支顺了再回来定目标。';
    }
    if (months <= 1) return '就差最后一脚了！稳住，马上就能看到结果 🎉';
    if (months <= 6) return '半年以内能看到终点，节奏很好 💪';
    if (months <= 12) return '一年以内，稳稳地走就能到 🌿';
    if (months <= 36) return '这是场慢跑不是冲刺。你已经开始了，这比什么都重要 🚶';
    if (months <= 60) return '路还长，但每清一笔，欠的人就少一个。我不催你 🤝';
    return '几年确实不短。但"愿意算清楚"这件事，已经比昨天前进了一大步。要不要先从一笔小的开始？🫂';
  }

  _celebrate(emoji, title, body) {

    document.getElementById('ceEmoji').textContent = emoji;
    document.getElementById('ceTitle').textContent = title;
    document.getElementById('ceBody').innerHTML = body;
    ov.classList.remove('hidden');
    ov.classList.add('show');
  }

  closeCelebrate() {
    const ov = document.getElementById('celebrateOverlay');
    if (ov) { ov.classList.remove('show'); ov.classList.add('hidden'); }
  }

                : `<button class="mini-btn ok" onclick="app.clearDebt('${d.id}')" title="记下这笔已收回">收回 ✓</button>`)
            : `<button class="mini-btn ghost" onclick="app.unclearDebt('${d.id}')" title="撤销，恢复为未清">↩ 撤销</button>`}

    const activeOwes = owes.filter(d => !d.cleared);

    const recvs = (this.assets.debts || []).filter(d => d.dir === 'receive');
    const activeRecvs = recvs.filter(d => !d.cleared);
    const doneRecvs = recvs.filter(d => d.cleared);

    el.innerHTML = `
      <div class="assets-sec">
        <div class="assets-sec-title">💎 存款目标
          <span class="grow"></span>
        </div>
        <div class="assets-save-grid">
          <div class="as-field"><label>当前存款</label><input class="num" id="as_cur" type="number" step="0.01" min="0" inputmode="decimal" value="${this._numDisp(sv.current)}" placeholder="0.00" onchange="app.setSavingsField('current',this.value)" onfocus="app.numFocus(this)" onblur="app.numBlur(this)"></div>
          <div class="as-field"><label>目标金额</label><input class="num" id="as_tgt" type="number" step="0.01" min="0" inputmode="decimal" value="${this._numDisp(sv.target)}" placeholder="不设则留空" onchange="app.setSavingsField('target',this.value)" onfocus="app.numFocus(this)" onblur="app.numBlur(this)"></div>
          <div class="as-field"><label>每月计划存</label><input class="num" id="as_plan" type="number" step="0.01" min="0" inputmode="decimal" value="${this._numDisp(sv.monthlyPlan)}" placeholder="留空=按结余" onchange="app.setSavingsField('monthlyPlan',this.value)" onfocus="app.numFocus(this)" onblur="app.numBlur(this)"></div>
          <div class="as-field"><label>目标名字</label><input id="as_name" value="${esc(sv.targetName)}" placeholder="选填" onchange="app.setSavingsField('targetName',this.value)"></div>
        </div>
        <div id="assetsSaveDyn"></div>
      </div>

      <div class="assets-sec">
        <div class="assets-sec-title">🙋 我欠别人的
          <span class="grow"></span>
          <button class="mini-btn ok" onclick="app.addDebt('owe')" title="记一笔我欠别人的钱">＋ 添加</button>
        </div>
        <div class="assets-repay">
          <span>每月可还</span>
          <input id="as_repay" type="number" step="0.01" min="0" inputmode="decimal" value="${this._numDisp(this.assets.repayMonthly)}"
            placeholder="留空=自动估算" onchange="app.setRepayMonthly(this.value)" onfocus="app.numFocus(this)" onblur="app.numBlur(this)">
          <span style="font-size:11px;opacity:.75;" id="assetsRepayHint"></span>
        </div>
        ${(activeOwes.length || doneOwes.length) ? [...activeOwes, ...doneOwes].map(d => debtRow(d, true)).join('') : '<div class="assets-empty">暂无记录</div>'}
        <div id="assetsOweDyn"></div>
      </div>

      <div class="assets-sec">
        <div class="assets-sec-title">🤝 别人欠我的
          <span class="grow"></span>
          <button class="mini-btn ok" onclick="app.addDebt('receive')" title="记一笔别人欠我的钱">＋ 添加</button>
        </div>
        ${(activeRecvs.length || doneRecvs.length) ? [...activeRecvs, ...doneRecvs].map(d => debtRow(d, false)).join('') : '<div class="assets-empty">暂无记录</div>'}
        <div id="assetsRecvDyn"></div>
      </div>
    `;
    this.refreshAssetsDyn();
  }

  // 只刷新动态区（进度条/达标预估/还款推演/应收汇总 + 预算提示），不重建输入行 → 编辑不丢焦点
  refreshAssetsDyn() {
    const sv = this.assets.savings;
    const cur = this._assetNum(sv.current);
    const tgt = this._assetNum(sv.target);
    const esc = s => this._escapeHtml(s == null ? '' : String(s));

    // ── 存款动态：进度条 + 达标预估 ──
    let saveDyn = '';
    if (tgt > 0) {
      const pct = Math.min(100, Math.max(0, (cur / tgt) * 100));
      saveDyn += `
        <div style="display:flex;align-items:center;gap:8px;margin-top:8px;">
          <span style="font-size:11px;color:var(--ink-2);white-space:nowrap;">${this._money(cur)} / ${this._money(tgt)}</span>
          <div style="flex:1;height:10px;background:var(--cream);border-radius:8px;overflow:hidden;">
            <div style="height:100%;width:${pct}%;border-radius:8px;background:linear-gradient(90deg,var(--mint),var(--mint-dark));transition:width .4s;"></div>
          </div>
          <span style="font-size:11px;color:var(--ink-2);white-space:nowrap;">${pct.toFixed(0)}%</span>
        </div>`;
      const p = this._savePlan();
      if (p.achieved) saveDyn += `<div class="assets-proj done"><span class="proj-big">🎉 目标已达成</span></div>`;
      else if (p.monthly > 0) {
        const label = this._monthLabel(p.months);
        saveDyn += `<div class="assets-proj"><span class="proj-big">预计 ${label} 达标</span><div>每月存 ¥${this._money(p.monthly)}，还差 ¥${this._money(tgt - cur)}</div></div>`;
      } else {
        saveDyn += `<div class="assets-proj hug"><div>填「每月计划存」后可估算达标时间</div></div>`;
      }
    }
    if (sv.targetName) {
      saveDyn += `<div class="assets-empty">🎯 ${esc(sv.targetName)}${sv.targetWhy ? ' — ' + esc(sv.targetWhy) : ''}</div>`;
    }
    const sdEl = document.getElementById('assetsSaveDyn');
    if (sdEl) sdEl.innerHTML = saveDyn;

    // ── 预算提示 ──
    const budget = this._monthlyBudget();
    const hintEl = document.getElementById('assetsRepayHint');
    if (hintEl) {
      if (this._assetNum(this.assets.repayMonthly) > 0) hintEl.innerHTML = '手填';
      else if (budget === null) hintEl.innerHTML = '待填';
      else if (budget > 0) hintEl.innerHTML = `≈ ¥${this._money(budget)}/月`;
      else hintEl.innerHTML = '待填';
    }

    // ── 还款推演 ──
    const owes = (this.assets.debts || []).filter(d => d.dir === 'owe');
    const activeOwes = owes.filter(d => !d.cleared);
    const doneOwes = owes.filter(d => d.cleared);
    let oweDyn = '';
    if (activeOwes.length) {
      const plan = this._owePlan();
      if (plan && (plan.noBudget || plan.impossible)) {
        oweDyn = `<div class="assets-proj hug"><div>${plan.impossible ? '当前预算还不上利息' : '填「每月可还」后可估算还清时间'}</div></div>`;
      } else if (plan) {
        const steps = plan.per.map((p, i) => {
          const who = esc(p.name) || `第${i + 1}笔`;
          return `<div>${i + 1}. ${who} → ${this._monthLabel(p.months)}</div>`;
        }).join('');
        const total = this._monthLabel(plan.totalMonths);
        oweDyn = `
          <div class="assets-proj">
            <span class="proj-big">${doneOwes.length ? '剩余' : '全部'}预计 ${total} 还清</span>
            <div style="margin-top:4px;">${steps}</div>
          </div>`;
      }
    }
    const odEl = document.getElementById('assetsOweDyn');
    if (odEl) odEl.innerHTML = oweDyn;

    // ── 应收汇总 ──
    const activeRecvs = (this.assets.debts || []).filter(d => d.dir === 'receive' && !d.cleared);
    let recvDyn = '';
    if (activeRecvs.length) {
      const totalRecv = activeRecvs.reduce((s, d) => s + this._assetNum(d.amount), 0);
      recvDyn = `<div class="assets-proj" style="background:linear-gradient(135deg,#EFF7F3,#fff);border-color:var(--mint);">
        <span class="proj-big">¥${this._money(totalRecv)} 未收回（${activeRecvs.length} 笔）</span>
      </div>`;
    }
    const rdEl = document.getElementById('assetsRecvDyn');
    if (rdEl) rdEl.innerHTML = recvDyn;

    this.updateAssetsTotal();
    this.renderAssetsSummary();
  }

  setSavingsField(field, value) {
    this.assets.savings[field] = value;
    this.saveAssets();
    this.refreshAssetsDyn();
  }

  setRepayMonthly(value) {
    this.assets.repayMonthly = value;
    this.saveAssets();
    this.refreshAssetsDyn();
  }

  setDebtField(id, field, value) {
    const d = (this.assets.debts || []).find(x => x.id === id);
    if (!d) return;
    d[field] = value;
    this.saveAssets();
    this.refreshAssetsDyn();
  }

  addDebt(dir) {
    const id = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    (this.assets.debts || (this.assets.debts = [])).push({ id, dir, name:'', amount:'', rate:'', cleared:false, clearedAt:'' });
    this.saveAssets();
    this.renderAssetsBody();
    const input = document.getElementById('as_dname_' + id);
    if (input) { input.focus(); input.select(); }
    this.showToast(dir === 'owe' ? '记下了这笔欠款，慢慢还，不急' : '记下了这笔应收，收回来记得更新存款');
  }

  deleteDebt(id) {
    if (!window.confirm('确定删除这条记录吗？删除后不可恢复。')) return;
    this.assets.debts = (this.assets.debts || []).filter(x => x.id !== id);
    this.saveAssets();
    this.renderAssets();
  }

  _todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  // 还清一笔（owe）/ 收回一笔（receive）→ 里程碑庆祝，强调账户数减少
  clearDebt(id) {
    const d = (this.assets.debts || []).find(x => x.id === id);
    if (!d) return;
    d.cleared = true;
    d.clearedAt = this._todayStr();
    const amt = this._assetNum(d.amount);
    const who = d.name || (d.dir === 'owe' ? '这笔欠款' : '这笔应收');
    this.saveAssets();
    // 庆祝：账户数减少（Princeton 研究：清掉一个账户本身就能降焦虑）
    const remain = (this.assets.debts || []).filter(x => x.dir === d.dir && !x.cleared).length;
    if (d.dir === 'owe') {
      const oweTotal = (this.assets.debts || []).filter(x => x.dir === 'owe' && !x.cleared).reduce((s, x) => s + this._assetNum(x.amount), 0);
      this._celebrate('🎉', '这一笔，清了。', `「${this._escapeHtml(who)}」¥${this._money(amt)} 已经还上。<br>你现在还欠 <b>${remain} 笔</b>，不是 ${remain + 1} 笔了。${oweTotal <= 0 ? '<br><b>全部还清了，好样的！</b>' : ''}`);
    } else {
      this._celebrate('🤝', '这笔，收回来了。', `「${this._escapeHtml(who)}」¥${this._money(amt)} 已经到账。<br>外面还剩 <b>${remain} 笔</b>应收。记得把这笔钱加到「当前存款」里 🎯`);
    }
    this.renderAssets();
  }

  unclearDebt(id) {
    const d = (this.assets.debts || []).find(x => x.id === id);
    if (!d) return;
    d.cleared = false;
    d.clearedAt = '';
    this.saveAssets();
    this.renderAssets();
    this.showToast('已撤销，恢复为未清状态');
  }

  // 收入区动态渲染：名称可编辑、右上×可删除、末尾「＋ 添加项目」
  // ══════════════════════════════════════════════════
  //  卡片排序（拖标题栏 或 点 ↑↓，顺序存 ledger_layout_v1）
  // ══════════════════════════════════════════════════
  get layoutKey() { return 'ledger_layout_v1'; }

  loadLayout() {
    const raw = localStorage.getItem(this.layoutKey);
    let saved = null;
    if (raw) { try { saved = JSON.parse(raw).order; } catch(e) {} }
    if (Array.isArray(saved) && saved.length) {
      // 只保留仍存在的卡片
      const valid = saved.filter(id => CARD_ORDER_DEFAULT.includes(id));
      // 把新增的卡片补进去：放在 todo（提醒待办）之前，保持"提醒待办默认置底"
      CARD_ORDER_DEFAULT.forEach(id => {
        if (valid.includes(id)) return;
        const ti = valid.indexOf('todo');
        if (id === 'todo' || ti < 0) valid.push(id);
        else valid.splice(ti, 0, id);
      });
      this.cardOrder = valid;
    } else {
      this.cardOrder = CARD_ORDER_DEFAULT.slice();
    }
  }

  saveLayout() {
    localStorage.setItem(this.layoutKey, JSON.stringify({ order: this.cardOrder }));
    this.updateSaveStatus();
    this._scheduleAutoBackup();
    this._scheduleCloudPush();
  }

  // ══════════════════════════════════════════════════════════
  //  数据保险箱（v8.12）
  //  目标：账目只存在浏览器里，清缓存 / 换设备就会丢。
  //        三层防护：① 手动导出下载  ② 自动写入本地文件  ③ 回收站可还原
  // ══════════════════════════════════════════════════════════

  get metaKey()  { return 'ledger_backup_meta_v1'; }
  get trashKey() { return 'ledger_trash_v1'; }
  get writeAtKey() { return 'ledger_write_at_v1'; }

  _globalBackupKeys() { return ['ledger_todos_v1', 'ledger_layout_v1', 'ledger_assets_v1']; }

  /** 收集全部需要备份的键：所有月份账目 + 3 个跨月全局键 */
  _collectBackupKeys() {
    const keys = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (/^ledger_v2_\d{4}_\d{2}$/.test(k)) keys[k] = localStorage.getItem(k);
      }
      this._globalBackupKeys().forEach(k => {
        const v = localStorage.getItem(k);
        if (v != null) keys[k] = v;
      });
    } catch (e) { /* 存储不可用时返回已收集部分 */ }
    return keys;
  }

  _buildBackupPayload() {
    return {
      app: '月记账本',
      backupVersion: 1,
      exportedAt: new Date().toISOString(),
      exportedBy: 'v8.12',
      keys: this._collectBackupKeys()
    };
  }

  /** 统计一份备份里到底有什么，用于给用户看「我备份了什么」 */
  _countBackupContent(payload) {
    const keys = (payload && payload.keys) || {};
    const monthList = Object.keys(keys).filter(k => /^ledger_v2_\d{4}_\d{2}$/.test(k)).sort();
    let todos = 0, debts = 0;
    try { const t = JSON.parse(keys['ledger_todos_v1'] || '{}'); todos = (t.todos || []).length; } catch (e) {}
    try { debts = (JSON.parse(keys['ledger_assets_v1'] || '{}').debts || []).length; } catch (e) {}
    return { months: monthList.length, monthList, todos, debts, keys: Object.keys(keys).length };
  }

  _downloadFile(filename, text, mime) {
    try {
      const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
      return true;
    } catch (e) { return false; }
  }

  // ── ① 手动导出 ────────────────────────────────
  exportBackup() {
    const payload = this._buildBackupPayload();
    const info = this._countBackupContent(payload);
    if (info.keys === 0) { this.showToast('还没有可备份的数据'); return; }
    const d = new Date();
    const stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    const ok = this._downloadFile(`记账本备份_${stamp}.json`, JSON.stringify(payload, null, 2), 'application/json');
    if (!ok) { alert('下载失败，请换个浏览器再试（推荐 Chrome / Edge）。'); return; }
    this._markBackedUp('manual');
    this.renderBackupCard();
    this.showToast(`已备份 ${info.months} 个月账目 · 存好这个文件 💾`);
  }

  // ── ② 导入恢复 ────────────────────────────────
  importBackup(mode) {
    this._pendingImportMode = mode || 'merge';
    const input = document.getElementById('backupImportInput');
    if (!input) return;
    input.value = '';
    input.click();
  }

  async handleBackupFile(file) {
    if (!file) return;
    let payload;
    try {
      payload = JSON.parse(await file.text());
    } catch (e) {
      alert('这个文件读不出内容（不是有效的 JSON）。\n\n请选择由「📤 立即备份」生成的备份文件。');
      return;
    }
    if (!payload || !payload.keys || typeof payload.keys !== 'object') {
      alert('这不是记账本的备份文件（里面没有 keys 字段）。\n\n请选择文件名形如「记账本备份_2026-09-05.json」的文件。');
      return;
    }
    const info = this._countBackupContent(payload);
    if (info.keys === 0) { alert('这个备份文件里没有任何数据。'); return; }

    const mode = this._pendingImportMode || 'merge';
    const when = payload.exportedAt ? new Date(payload.exportedAt).toLocaleString('zh-CN') : '未知时间';
    const summary =
      `备份文件：${file.name}\n` +
      `导出时间：${when}\n` +
      `包含内容：${info.months} 个月账目 · 待办 ${info.todos} 条 · 存款外账 ${info.debts} 笔\n`;

    if (mode === 'replace') {
      const cur = this._countBackupContent(this._buildBackupPayload());
      if (!confirm(
        summary + `\n「覆盖恢复」会用备份文件替换当前浏览器的全部数据。\n` +
        `（当前 ${cur.months} 个月账目会先存入回收站，还能还原）\n\n确定继续吗？`
      )) return;
    } else {
      if (!confirm(
        summary + `\n「合并恢复」只补充本地没有的数据，不会改动你现有的任何记录。\n\n确定导入吗？`
      )) return;
    }
    this._applyBackup(payload, mode);
  }

  _applyBackup(payload, mode) {
    const keys = payload.keys || {};
    if (mode === 'replace') {
      const cur = this._buildBackupPayload();
      if (Object.keys(cur.keys).length > 0) this._trashPush('导入前的全部数据', cur.keys);
    }
    let added = 0, replaced = 0, skipped = 0;
    Object.entries(keys).forEach(([k, v]) => {
      const has = localStorage.getItem(k) != null;
      if (mode === 'merge' && has) { skipped++; return; }
      localStorage.setItem(k, v);
      has ? replaced++ : added++;
    });
    this._markBackedUp('import');
    this.loadData(); this.loadTodos(); this.loadAssets(); this.loadLayout();
    this.applyCardOrder();
    this.render();
    const tail = mode === 'replace' ? `新增 ${added} 项、替换 ${replaced} 项` : `新增 ${added} 项、跳过已有 ${skipped} 项`;
    this.showToast(`${mode === 'replace' ? '覆盖恢复' : '合并恢复'}完成：${tail} ✅`);
  }

  // ── ③ 自动备份到本地文件（File System Access API）────────
  _fsSupported() { return typeof window.showSaveFilePicker === 'function'; }

  async connectBackupFile() {
    if (!this._fsSupported()) {
      alert(
        '当前浏览器不支持「自动备份到文件」。\n\n' +
        '请用上面的「📤 立即备份」把文件存下来。\n\n' +
        '（电脑版 Chrome / Edge 支持自动备份；iPhone 上的浏览器暂不支持）'
      );
      return;
    }
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: '记账本自动备份.json',
        types: [{ description: 'JSON 备份文件', accept: { 'application/json': ['.json'] } }]
      });
      this._backupHandle = handle;
      await this._saveHandle(handle);
      const ok = await this.writeBackupFile(false);
      if (ok) this.showToast('已连接！以后每次记账会自动写进这个文件 🔗');
      this._backupPerm = 'granted';
      this.renderBackupCard();
    } catch (e) {
      if (e && e.name === 'AbortError') return;   // 用户主动取消，不打扰
      console.warn('connectBackupFile', e);
      this.showToast('连接失败：' + (e && e.message ? e.message : '未知错误'));
    }
  }

  async writeBackupFile(silent) {
    if (!this._backupHandle) return false;
    try {
      if (!(await this._ensureHandlePermission(this._backupHandle))) {
        this._backupPerm = 'prompt';
        if (!silent) this.showToast('还没有文件权限，请点「🔗 重新授权」');
        return false;
      }
      const w = await this._backupHandle.createWritable();
      await w.write(JSON.stringify(this._buildBackupPayload(), null, 2));
      await w.close();
      this._backupPerm = 'granted';
      this._markBackedUp('auto');
      return true;
    } catch (e) {
      console.warn('writeBackupFile', e);
      if (!silent) this.showToast('自动备份写入失败：' + (e && e.message ? e.message : '未知错误'));
      return false;
    }
  }

  async _ensureHandlePermission(handle) {
    try {
      const opts = { mode: 'readwrite' };
      if (await handle.queryPermission(opts) === 'granted') return true;
      if (await handle.requestPermission(opts) === 'granted') return true;
    } catch (e) { /* 非用户手势时会抛错，静默失败 */ }
    return false;
  }

  /** 存 handle 用；浏览器不支持 IndexedDB（隐私模式等）时静默降级为「本次会话内有效」 */
  _handleDB() {
    return new Promise((resolve, reject) => {
      if (typeof indexedDB === 'undefined') { reject(new Error('IndexedDB unavailable')); return; }
      const req = indexedDB.open('ledger_backup_db', 1);
      req.onupgradeneeded = () => { try { req.result.createObjectStore('handles'); } catch (e) {} };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async _saveHandle(handle) {
    try {
      const db = await this._handleDB();
      await new Promise((res, rej) => {
        const tx = db.transaction('handles', 'readwrite');
        tx.objectStore('handles').put(handle, 'auto');
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
      localStorage.setItem('ledger_backup_linked_v1', '1');
    } catch (e) {
      // 存不下 handle 只是下次打开要重新连接，不影响本次自动备份，静默处理
      try { localStorage.setItem('ledger_backup_linked_v1', '1'); } catch (e2) {}
    }
  }

  async _loadHandle() {
    try {
      if (typeof indexedDB === 'undefined') return null;
      const db = await this._handleDB();
      return await new Promise(res => {
        const tx = db.transaction('handles', 'readonly');
        const r = tx.objectStore('handles').get('auto');
        r.onsuccess = () => res(r.result || null);
        r.onerror = () => res(null);
      });
    } catch (e) { return null; }
  }

  /** 节流触发自动写入，避免每敲一个字就写一次文件 */
  _scheduleAutoBackup() {
    if (!this._backupHandle) return;
    if (this._autoBackupTimer) clearTimeout(this._autoBackupTimer);
    this._autoBackupTimer = setTimeout(() => {
      this._autoBackupTimer = null;
      this.writeBackupFile(true);
    }, 4000);
  }

  /** 启动时恢复连接；若本地是空的而备份文件有数据，主动提示恢复 */
  async initBackupLink() {
    if (!this._fsSupported()) return;
    if (localStorage.getItem('ledger_backup_linked_v1') !== '1') return;
    const handle = await this._loadHandle();
    if (!handle) return;
    this._backupHandle = handle;
    try {
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      this._backupPerm = perm;
    } catch (e) { this._backupPerm = 'prompt'; }
    if (this._backupPerm === 'granted') await this._tryAutoRestore();
    this.renderBackupCard();
  }

  async _tryAutoRestore() {
    const localKeys = Object.keys(this._collectBackupKeys());
    if (localKeys.length > 0) return;   // 本地有数据，不打扰
    let payload;
    try {
      const file = await this._backupHandle.getFile();
      payload = JSON.parse(await file.text());
    } catch (e) { return; }
    const info = this._countBackupContent(payload);
    if (info.keys === 0) return;
    const ok = confirm(
      `检测到你的备份文件里有 ${info.months} 个月的账目，但当前浏览器里是空的。\n\n` +
      `是不是刚清理过浏览器缓存？点「确定」立刻恢复回来。`
    );
    if (ok) this._applyBackup(payload, 'merge');
  }

  // ── ④ 回收站：误删可还原 ──────────────────────
  _loadTrash() {
    try {
      const list = JSON.parse(localStorage.getItem(this.trashKey) || '[]');
      return Array.isArray(list) ? list : [];
    } catch (e) { return []; }
  }

  _trashPush(label, keysObj) {
    try {
      const list = this._loadTrash();
      list.unshift({ id: 'tr_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6), label, at: new Date().toISOString(), keys: keysObj });
      localStorage.setItem(this.trashKey, JSON.stringify(list.slice(0, 5)));
    } catch (e) { console.warn('trashPush', e); }
  }

  toggleTrash() { this._trashOpen = !this._trashOpen; this.renderBackupCard(); }

  restoreTrash(id) {
    const list = this._loadTrash();
    const item = list.find(t => t.id === id);
    if (!item) return;
    if (!confirm(`确定还原「${item.label}」吗？\n\n会以回收站里这份为准，覆盖当前同名数据。`)) return;
    Object.entries(item.keys || {}).forEach(([k, v]) => localStorage.setItem(k, v));
    localStorage.setItem(this.trashKey, JSON.stringify(list.filter(t => t.id !== id)));
    this.loadData(); this.loadTodos(); this.loadAssets(); this.loadLayout();
    this.applyCardOrder();
    this.render();
    this.showToast(`「${item.label}」已还原 ✅`);
  }

  // ── ⑤ 备份时间与提醒 ──────────────────────────
  _loadBackupMeta() {
    try { return JSON.parse(localStorage.getItem(this.metaKey) || '{}'); } catch (e) { return {}; }
  }

  _markBackedUp(kind) {
    try {
      const meta = this._loadBackupMeta();
      meta.lastAt = new Date().toISOString();
      meta.kind = kind;
      meta.count = (meta.count || 0) + 1;
      localStorage.setItem(this.metaKey, JSON.stringify(meta));
    } catch (e) {}
    this.updateSaveStatus();
  }

  _daysSinceBackup() {
    const meta = this._loadBackupMeta();
    if (!meta.lastAt) return null;
    const diff = Date.now() - new Date(meta.lastAt).getTime();
    return Math.max(0, Math.floor(diff / 86400000));
  }

  _backupTimeText() {
    const days = this._daysSinceBackup();
    if (days === null) return '从未备份';
    if (days === 0) return '今天已备份';
    if (days === 1) return '昨天备份';
    return `${days} 天前备份`;
  }

  // ── ⑥ 渲染 ────────────────────────────────────
  // ══════════════════════════════════════════════════════════
  //  ☁️ 云同步（v8.17） + 📍 数据位置（v8.18） + 📝 备注不丢（v8.19） + 🔍 单项 Top5（v8.20/v8.21 饼图修复）
  //  账目自动存到云端：换手机 / 清缓存 / 换入口都不会丢，
  //  也不用手找备份文件。后端是 CloudBase 云函数，前端零 SDK。
  // ══════════════════════════════════════════════════════════
  get cloudApi()      { return 'https://prod-d5g2g0gkh52677ca8-1473248310.ap-shanghai.app.tcloudbase.com/ledger-sync'; }
  get syncCodeKey()   { return 'ledger_sync_code_v1'; }
  get cloudMetaKey()  { return 'ledger_cloud_meta_v1'; }
  get snapKey()       { return 'ledger_snapshot_v1'; }

  _cloudMeta() {
    try { return JSON.parse(localStorage.getItem(this.cloudMetaKey) || '{}'); } catch (e) { return {}; }
  }
  _setCloudMeta(patch) {
    try { localStorage.setItem(this.cloudMetaKey, JSON.stringify(Object.assign(this._cloudMeta(), patch))); } catch (e) {}
  }

  /** 8 位同步码，去掉了容易看错的 I/O/0/1 */
  _genSyncCode() {
    const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let out = '';
    try {
      const a = new Uint8Array(8);
      if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(a);
      else for (let i = 0; i < 8; i++) a[i] = Math.floor(Math.random() * 256);
      for (let i = 0; i < 8; i++) out += abc[a[i] % abc.length];
    } catch (e) {
      for (let i = 0; i < 8; i++) out += abc[Math.floor(Math.random() * abc.length)];
    }
    return out.slice(0, 4) + '-' + out.slice(4);
  }

  cloudCode() { try { return localStorage.getItem(this.syncCodeKey) || ''; } catch (e) { return ''; } }
  cloudOn()   { return !!this.cloudCode(); }

  _ago(ts) {
    const d = Date.now() - ts;
    if (d < 60000) return '刚刚';
    if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前';
    if (d < 86400000) return Math.floor(d / 3600000) + ' 小时前';
    if (d < 2592000000) return Math.floor(d / 86400000) + ' 天前';
    try { return new Date(ts).toLocaleDateString('zh-CN'); } catch (e) { return '很久以前'; }
  }

  /** 当前这个地址到底存了多少账目 —— 让「数据在哪儿」一眼可见 */
  _localStat() {
    let months = 0, cells = 0;
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!/^ledger_v2_\d{4}_\d{2}$/.test(k)) continue;
        let d = null;
        try { d = JSON.parse(localStorage.getItem(k)); } catch (e) { continue; }
        if (!d) continue;
        const ent = d.entries || {};
        let has = false;
        for (const day of Object.keys(ent)) {
          const row = ent[day] || {};
          for (const ck of Object.keys(row)) {
            const v = row[ck];
            if (v === '' || v === null || v === undefined) continue;
            if (typeof v === 'number' && v === 0) continue;
            cells++; has = true;
          }
        }
        if (has) months++;
      }
    } catch (e) {}
    let last = 0;
    try { last = parseInt(localStorage.getItem(this.writeAtKey) || '0', 10) || 0; } catch (e) {}
    return { months: months, cells: cells, last: last };
  }

  _whereAmI() {
    try {
      if (location.protocol === 'file:') return '本地文件';
      return (location.host || location.hostname || '未知地址');
    } catch (e) { return '未知地址'; }
  }

  async _cloudCall(action, payload) {
    const code = this.cloudCode();
    if (!code) return { ok: false, error: '未开启' };
    try {
      const res = await fetch(this.cloudApi, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: action, code: code, payload: payload || null })
      });
      const txt = await res.text();
      let j = null;
      try { j = JSON.parse(txt); } catch (e) { return { ok: false, error: 'NET' }; }
      if (j && j.code === 'HTTPSERVICE_NONACTIVATED') return { ok: false, error: 'GATEWAY_OFF' };
      if (j && j.code && j.ok === undefined) return { ok: false, error: String(j.code) };
      return j || { ok: false, error: 'EMPTY' };
    } catch (e) {
      return { ok: false, error: 'NET' };
    }
  }

  _cloudErrText(code) {
    const map = {
      'GATEWAY_OFF': '云端通道还没开通，数据仍安全存在本机',
      'NET': '网络不通，数据仍安全存在本机',
      '未开启': '还没开启云同步'
    };
    return map[code] || ('同步失败：' + code);
  }

  async cloudEnable() {
    if (!this.cloudCode()) {
      try { localStorage.setItem(this.syncCodeKey, this._genSyncCode()); } catch (e) {}
    }
    this._setCloudMeta({ status: 'syncing' });
    this.renderBackupCard();
    const r = await this._cloudCall('push', this._buildBackupPayload());
    if (r.ok) {
      this._setCloudMeta({ status: 'ok', lastAt: Date.now(), error: '' });
      this.showToast('☁️ 云同步已开启，数据已上传');
    } else {
      this._setCloudMeta({ status: 'error', error: r.error });
      this.showToast('☁️ ' + this._cloudErrText(r.error));
    }
    this.renderBackupCard();
  }

  cloudDisable() {
    if (!confirm('关闭云同步后，这台设备不再自动上传。\n\n云端已存的数据不会删除，下次用同一个同步码还能取回。\n\n确定关闭吗？')) return;
    try { localStorage.removeItem(this.syncCodeKey); } catch (e) {}
    this._setCloudMeta({ status: 'off', error: '' });
    this.renderBackupCard();
    this.showToast('已关闭云同步');
  }

  cloudBindCode() {
    const cur = this.cloudCode();
    const v = prompt(
      (cur ? ('当前同步码：' + cur + '\n\n换设备或数据丢了？输入你保存过的同步码，把数据取回来：')
           : '输入你的同步码（换设备、清缓存后用它把数据取回来）：')
    );
    if (!v) return;
    const code = String(v).trim();
    if (!/^[A-Za-z0-9_-]{4,32}$/.test(code)) {
      alert('同步码格式不对。应该是像 ABCD-2345 这样 8 位字母数字（中间有个横杠）。');
      return;
    }
    try { localStorage.setItem(this.syncCodeKey, code); } catch (e) {}
    this._setCloudMeta({ status: 'syncing', error: '' });
    this.renderBackupCard();
    this.cloudPull(true);
  }

  cloudCopyCode() {
    const code = this.cloudCode();
    if (!code) return;
    const done = () => this.showToast('同步码已复制，存到微信收藏或备忘录里');
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(done, () => this._fallbackCopy(code, done));
      } else this._fallbackCopy(code, done);
    } catch (e) { this._fallbackCopy(code, done); }
  }
  _fallbackCopy(text, done) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
      done();
    } catch (e) { prompt('复制这段同步码：', text); }
  }

  _scheduleCloudPush() {
    if (!this.cloudOn()) return;
    if (this._cloudPushTimer) clearTimeout(this._cloudPushTimer);
    this._cloudPushTimer = setTimeout(() => { this._cloudPushTimer = null; this.cloudPush(true); }, 3000);
  }

  async cloudPush(silent) {
    if (!this.cloudOn()) return;
    const r = await this._cloudCall('push', this._buildBackupPayload());
    if (r.ok) this._setCloudMeta({ status: 'ok', lastAt: Date.now(), error: '' });
    else this._setCloudMeta({ status: 'error', error: r.error });
    if (!silent) {
      this.renderBackupCard();
      this.showToast(r.ok ? '☁️ 已传到云端' : ('☁️ ' + this._cloudErrText(r.error)));
    }
  }

  async cloudPull(manual) {
    if (!this.cloudOn()) return;
    this._setCloudMeta({ status: 'syncing' });
    if (manual) this.renderBackupCard();
    const r = await this._cloudCall('pull');
    if (!r.ok) {
      this._setCloudMeta({ status: 'error', error: r.error });
      if (manual) { this.renderBackupCard(); this.showToast('☁️ ' + this._cloudErrText(r.error)); }
      return;
    }
    const rec = r.data;
    if (!rec || !rec.payload || !rec.payload.keys) {
      this._setCloudMeta({ status: 'ok', lastAt: Date.now(), error: '' });
      if (manual) { this.cloudPush(true); this.showToast('云端还没有数据，已把本地数据传上去'); }
      this.renderBackupCard();
      return;
    }
    const local = this._countBackupContent(this._buildBackupPayload());
    const remote = this._countBackupContent(rec.payload);

    // 本机是空的（刚清过缓存 / 换了设备）→ 直接取回
    if (local.keys === 0) {
      this._applyBackup(rec.payload, 'merge');
      this._setCloudMeta({ status: 'ok', lastAt: Date.now(), error: '' });
      this.showToast('☁️ 已从云端取回 ' + remote.months + ' 个月账目');
      this.renderBackupCard();
      return;
    }
    if (manual) {
      const when = rec.updatedAt ? new Date(rec.updatedAt).toLocaleString('zh-CN') : '未知时间';
      const take = confirm(
        '云端有一份数据：' + remote.months + ' 个月账目 · ' + remote.todos + ' 条待办（更新于 ' + when + '）\n' +
        '本机现在有 ' + local.months + ' 个月账目。\n\n' +
        '点「确定」= 用云端补齐本机没有的（安全，不会删你现在的数据）\n' +
        '点「取消」= 不动云端，只把本机数据传上去'
      );
      if (take) {
        this._applyBackup(rec.payload, 'merge');
        this._setCloudMeta({ status: 'ok', lastAt: Date.now(), error: '' });
        this.showToast('☁️ 已用云端数据补齐');
      } else {
        await this.cloudPush(true);
      }
      this.renderBackupCard();
      return;
    }
    // 后台自动拉取：只做安全合并（补本机没有的键，绝不覆盖已有数据）
    let added = 0;
    Object.keys(rec.payload.keys || {}).forEach(function (k) {
      if (localStorage.getItem(k) == null) { localStorage.setItem(k, rec.payload.keys[k]); added++; }
    });
    if (added) { this.loadData(); this.loadTodos(); this.loadAssets(); this.loadLayout(); this.render(); }
    this._setCloudMeta({ status: 'ok', lastAt: Date.now(), error: '' });
    if (added) this.showToast('☁️ 云端有 ' + added + ' 项新数据，已合并');
    this.renderBackupCard();
  }

  // ── 本地快照：改错了能回滚 ──────────────────────
  _loadSnaps() {
    try { const l = JSON.parse(localStorage.getItem(this.snapKey) || '[]'); return Array.isArray(l) ? l : []; }
    catch (e) { return []; }
  }

  /** 存一份当前状态。内容没变化就不重复存。最多 8 份、总量 ≤1.2MB，防止撑爆 localStorage */
  snapSave(label) {
    try {
      const keys = this._collectBackupKeys();
      if (!Object.keys(keys).length) return false;
      const sig = JSON.stringify(keys);
      let list = this._loadSnaps();
      if (list.length && list[0].sig === sig) return false;
      list.unshift({
        id: 'sn_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        at: new Date().toISOString(),
        label: label || '自动',
        n: Object.keys(keys).length,
        keys: keys,
        sig: sig
      });
      let total = JSON.stringify(list).length;
      while ((list.length > 8 || total > 1200000) && list.length > 1) {
        list = list.slice(0, list.length - 1);
        total = JSON.stringify(list).length;
      }
      localStorage.setItem(this.snapKey, JSON.stringify(list));
      return true;
    } catch (e) { return false; }
  }

  /** 从本机快照 / 回收站里找回被旧版本清掉的备注：只补「当前没有的」，绝不覆盖已有。返回救回的天数 */
  _salvageNotes() {
    const self = this;
    let saved = 0;
    const scan = function (keys) {
      Object.keys(keys || {}).forEach(function (k) {
        if (!/^ledger_v2_\d{4}_\d{2}$/.test(k)) return;
        let src = null;
        try { src = JSON.parse(keys[k]); } catch (e) { return; }
        if (!src) return;
        const srcNotes = Object.assign({}, src.notes || {}, src.cellNotes || {});
        const days = Object.keys(srcNotes).filter(function (d) {
          return srcNotes[d] && typeof srcNotes[d] === 'object' && Object.keys(srcNotes[d]).length;
        });
        if (!days.length) return;
        let cur = null;
        try { cur = JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return; }
        if (!cur) return;
        const curNotes = (cur.cellNotes && typeof cur.cellNotes === 'object') ? cur.cellNotes : {};
        let added = 0;
        days.forEach(function (d) {
          if (curNotes[d] && Object.keys(curNotes[d]).length) return;  // 已有就不动
          curNotes[d] = srcNotes[d];
          added++;
        });
        if (!added) return;
        cur.cellNotes = curNotes;
        try { localStorage.setItem(k, JSON.stringify(cur)); saved += added; } catch (e) {}
        if (k === self.storageKey) self.cellNotes = curNotes;  // 当前月同步进内存
      });
    };
    this._loadSnaps().forEach(function (s) { scan(s.keys); });
    this._loadTrash().forEach(function (t) { scan(t.keys); });
    return saved;
  }

  snapRestore(id) {
    const list = this._loadSnaps();
    const s = list.filter(function (x) { return x.id === id; })[0];
    if (!s) return;
    if (!confirm('回到 ' + new Date(s.at).toLocaleString('zh-CN') + ' 的状态？\n\n（现在的数据会先进回收站，还能再换回来）')) return;
    this._trashPush('回滚前的当前数据', this._collectBackupKeys());
    Object.keys(s.keys || {}).forEach(function (k) { localStorage.setItem(k, s.keys[k]); });
    this.loadData(); this.loadTodos(); this.loadAssets(); this.loadLayout();
    this.applyCardOrder(); this.render();
    this.showToast('已回滚');
  }

  snapClear() {
    if (!confirm('清空本机全部快照？\n\n（云端数据和当前账目不受影响）')) return;
    try { localStorage.removeItem(this.snapKey); } catch (e) {}
    this.renderBackupCard();
    this.showToast('快照已清空');
  }

  renderBackupCard() {
    const body = document.getElementById('backupBody');
    const badge = document.getElementById('backupBadge');
    if (!body) return;

    const days = this._daysSinceBackup();
    let cls = 'backup-status', icon = '🛡️', title = '', sub = '';
    if (days === null) {
      cls += ' never'; icon = '⚠️';
      title = '还没备份过';
      sub = '现在点一下「立即备份」，以后清缓存也不怕了。';
    } else if (days > 7) {
      cls += ' stale'; icon = '⏰';
      title = `已经 ${days} 天没备份了`;
      sub = '账目只存在这台设备的浏览器里，建议现在备份一次。';
    } else {
      icon = '✅';
      title = this._backupTimeText();
      sub = '清理浏览器缓存、换手机前，记得先备份。';
    }

    if (badge) {
      const txt = this._backupTimeText();
      badge.textContent = txt;
      badge.className = 'budget-total' + (days === null || days > 7 ? ' coral' : '');
      badge.title = '上次备份时间';
    }

    const fsOk = this._fsSupported();
    const linked = !!this._backupHandle;
    const autoLabel = linked
      ? (this._backupPerm === 'granted' ? '🔗 自动备份已开启' : '🔗 重新授权自动备份')
      : '🔗 自动备份到文件';

    const fileRow = (fsOk && linked)
      ? `<div class="backup-file-row">
           <span>📁</span>
           <span class="bf-name">${this._escapeHtml(this._backupHandle && this._backupHandle.name ? this._backupHandle.name : '已连接的备份文件')}</span>
           <button class="mini-btn ok" onclick="app.writeBackupFile(false)">立即写入</button>
         </div>`
      : '';

    const trash = this._loadTrash();
    let trashHtml = '';
    if (trash.length) {
      const open = !!this._trashOpen;
      trashHtml = `
      <div class="backup-trash">
        <div class="backup-trash-head" onclick="app.toggleTrash()">
          <span>🗂️ 回收站</span>
          <span class="bt-count">${trash.length}</span>
          <span style="flex:1"></span>
          <span class="bt-caret">${open ? '收起 ▲' : '展开 ▼'}</span>
        </div>
        ${open ? `<div class="backup-trash-list">${trash.map(t => `
          <div class="backup-trash-item">
            <div class="ti-main">
              <div class="ti-name">${this._escapeHtml(t.label)}</div>
              <div class="ti-meta">${new Date(t.at).toLocaleString('zh-CN')} · 共 ${Object.keys(t.keys || {}).length} 项</div>
            </div>
            <button class="mini-btn ok" onclick="app.restoreTrash('${t.id}')">↩️ 还原</button>
          </div>`).join('')}</div>` : ''}
      </div>`;
    }

    const ls = this._localStat();
    const locHtml = `
      <div class="bk-loc${ls.cells ? '' : ' empty'}">
        <div class="bk-loc-h">📍 当前地址：${this._escapeHtml(this._whereAmI())}</div>
        ${ls.cells
          ? `<div class="bk-loc-n"><b>${ls.cells}</b> 笔 · <b>${ls.months}</b> 个月${ls.last ? ' · 最后改动 ' + this._ago(ls.last) : ''}</div>`
          : `<div class="bk-loc-n">这个地址还没有账目。换过地址、清过缓存的话，数据不在这儿</div>`}
      </div>`;

    const cm = this._cloudMeta();
    const onCloud = this.cloudOn();
    const st = cm.status || 'ok';
    const stTxt = st === 'error' ? '未连接' : (st === 'syncing' ? '同步中' : '已开启');
    const lastTxt = cm.lastAt ? this._ago(cm.lastAt) : '从未';

    body.innerHTML = `

             style="display:none" onchange="app.handleBackupFile(this.files[0])">

  }

  applyCardOrder() {
    const c = document.querySelector('.container');
    if (!c) return;
    (this.cardOrder || CARD_ORDER_DEFAULT).forEach(id => {
      const el = c.querySelector(`.sortable-card[data-card="${id}"]`);
      if (el) c.appendChild(el);
    });
    // 无花销日统计条（非卡片）：固定跟在「预算」卡片之后
    const bar = document.getElementById('noSpendBarContainer');
    const budget = c.querySelector('.sortable-card[data-card="budget"]');
    if (bar && budget && budget.nextSibling !== bar) {
      budget.parentNode.insertBefore(bar, budget.nextSibling);
    }
    // 操作按钮始终在最底部
    const btnRow = c.querySelector('.btn-row');
    if (btnRow) c.appendChild(btnRow);
  }

  // ↑↓ 按钮（移动端也能用）
  moveCard(id, delta) {
    const i = this.cardOrder.indexOf(id);
    if (i < 0) return;
    const j = i + delta;
    if (j < 0 || j >= this.cardOrder.length) return;
    const arr = this.cardOrder.slice();
    [arr[i], arr[j]] = [arr[j], arr[i]];
    this.cardOrder = arr;
    this.saveLayout();
    this.applyCardOrder();
    this.showToast(`「${CARD_NAMES[id] || id}」已${delta < 0 ? '上移' : '下移'}`);
  }

  // ── 拖拽（拖标题栏 → 放到目标卡片任意位置）──
  onCardDragStart(e, id) {
    this._dragId = id;
    const card = e.currentTarget.closest('.sortable-card');
    if (card) card.classList.add('dragging');
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', id); } catch(err) {}
    }
  }

  onCardDragOver(e) {
    e.preventDefault();   // 必须，否则不会触发 drop
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    const card = e.currentTarget;
    if (card && card.classList && card.classList.contains('sortable-card')
        && card.dataset.card !== this._dragId) {
      card.classList.add('drag-over');
    }
  }

  onCardDrop(e, targetId) {
    e.preventDefault();
    const card = e.currentTarget;
    if (card && card.classList) card.classList.remove('drag-over');
    const srcId = this._dragId || (e.dataTransfer ? e.dataTransfer.getData('text/plain') : '');
    if (!srcId || srcId === targetId) return;
    const from = this.cardOrder.indexOf(srcId);
    const to   = this.cardOrder.indexOf(targetId);
    if (from < 0 || to < 0) return;
    const arr = this.cardOrder.slice();
    arr.splice(to, 0, arr.splice(from, 1)[0]);
    this.cardOrder = arr;
    this.saveLayout();
    this.applyCardOrder();
    this.showToast(`「${CARD_NAMES[srcId] || srcId}」已移到「${CARD_NAMES[targetId] || targetId}」位置`);
  }

  onCardDragEnd() {
    document.querySelectorAll('.sortable-card').forEach(el => {
      el.classList.remove('dragging', 'drag-over');
    });
    this._dragId = null;
  }

  renderTracking() {
    const grid = document.getElementById('incomeGrid');
    if (!grid) return;
    if (!Array.isArray(this.incomeItems)) this.incomeItems = this._defaultIncomeItems('', '', '', null);

    let html = '';
    this.incomeItems.forEach(it => {
      const isMinus = it.sign === '-';
      html += `
        <div class="tracking-item">
          <button class="del-col-btn" onclick="app.deleteIncomeItem('${it.id}')" title="删除此项">×</button>
          <input class="income-name-input" id="incname_${it.id}"
            value="${this._escapeHtml(it.name || '')}"
            onchange="app.onIncomeNameChange('${it.id}')" placeholder="项目名">
          <div class="tracking-input-row">
            <button class="sign-btn${isMinus ? ' minus' : ''}" id="sign_${it.id}"
              onclick="app.toggleIncomeSign('${it.id}')" title="点一下切换 加 / 减">${isMinus ? '−' : '＋'}</button>
            <input type="number" id="incamt_${it.id}" placeholder="0" step="0.01" inputmode="decimal"

              onfocus="app.numFocus(this)" onblur="app.numBlur(this)">

  renderSummary() {
    const el = document.getElementById('summaryContent');
    const grandTotal = this.getGrandTotal();
    const netIncome = this.getNetIncome();
    const balance = netIncome - grandTotal;
    const noSpendDays = this.getNoSpendDays();
    const hasData = grandTotal > 0 || netIncome !== 0 || noSpendDays.length > 0;

    // View toggle
    const toggle = `<div class="summary-toggle">
      <button class="${this.summaryView==='pie'?'active':''}" onclick="app.switchSummaryView('pie')">🥧 饼图</button>
      <button class="${this.summaryView==='bar'?'active':''}" onclick="app.switchSummaryView('bar')">📊 柱状</button>
      <button class="${this.summaryView==='table'?'active':''}" onclick="app.switchSummaryView('table')">📋 表格</button>
    </div>`;

    const head = noSpendDays.length > 0
      ? `<div class="no-spend-bar" style="margin-bottom:12px;">
          <span>🟢 无花销日</span><span class="count">${noSpendDays.length}</span><span>天</span>
        </div>`
      : '';

    let body;
    if (!hasData) {
      body = '<div class="analytics-empty">本月还没有记录，开始记账吧 🌿</div>';
    } else if (this.summaryView === 'pie') {
      body = this._renderSummaryPie(grandTotal);
    } else if (this.summaryView === 'bar') {
      body = this._renderSummaryBar();
    } else {
      body = this._renderSummaryTable(grandTotal);
    }

    // 收入 / 支出 / 结余 三行：结余固定放这里，所有视图都显示
    const footer = `<div class="summary-footer">
        <div class="sf-row"><span>📈 收入合计</span><span class="val income">¥${this._money(netIncome)}</span></div>
        <div class="sf-row"><span>📉 支出合计</span><span class="val expense">¥${this._money(grandTotal)}</span></div>
        <div class="sf-row final"><span>💰 本月结余</span><span class="val${balance < 0 ? ' expense' : ''}">¥${this._money(balance)}</span></div>
      </div>`;

    el.classList.toggle('summary-fixed', hasData);
    el.innerHTML = toggle + head + body + footer;
