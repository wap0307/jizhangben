  // ── Summary Chart Sub-renderers ──
  _getCategories() {
    return this.columns
      .map(c => ({ key:c.key, name:c.name, value:this.getColTotal(c.key), budget:c.budget || 0 }))
      .filter(c => c.value > 0)
      .sort((a, b) => b.value - a.value);
  }

  _palette(i) {
    const P = ['#4FAE91','#FFB5A7','#F9C74F','#90BE6D','#577590','#F8961E','#F3722C','#43AA8B','#9D8189','#A5D8E6','#E5989B','#B5E48C','#CB997E','#A3B18A'];
    return P[i % P.length];
  }

  _polar(cx, cy, r, angle) {
    const a = (angle - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  }

  _donutArc(cx, cy, r, inner, startAngle, endAngle) {
    const s = this._polar(cx, cy, r, startAngle);
    const e = this._polar(cx, cy, r, endAngle);
    const si = this._polar(cx, cy, inner, endAngle);
    const ei = this._polar(cx, cy, inner, startAngle);
    const large = (endAngle - startAngle) > 180 ? 1 : 0;
    return `M ${s.x.toFixed(2)} ${s.y.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${e.x.toFixed(2)} ${e.y.toFixed(2)} `
         + `L ${si.x.toFixed(2)} ${si.y.toFixed(2)} A ${inner} ${inner} 0 ${large} 0 ${ei.x.toFixed(2)} ${ei.y.toFixed(2)} Z`;
  }

  _renderSummaryPie(grandTotal) {
    const cats = this._getCategories();
    if (cats.length === 0) return '<div class="analytics-empty">本月还没有花销记录</div>';
    const W = 380, H = 220, cx = 190, cy = 110, r = 70, inner = 42;
    const labelR = r + 4, kneeR = r + 16;
    let angle = 0;
    const arcs = cats.map((d, i) => {
      if (cats.length === 1) return { i, color: this._palette(i), d: null, single: true, mid: 90 };
      const frac = d.value / grandTotal;
      const start = angle, end = angle + frac * 360;
      const mid = (start + end) / 2;
      angle = end;
      return { i, color: this._palette(i), d: this._donutArc(cx, cy, r, inner, start, end), single: false, mid };
    });
    // 把每个扇区的标注几何算出来：引线起点(扇区外缘) → 拐点 → 标签锚点，左右分列
    const items = arcs.map(a => {
      const rad = (a.mid - 90) * Math.PI / 180;
      const ex = cx + labelR * Math.cos(rad), ey = cy + labelR * Math.sin(rad);
      const kx = cx + kneeR * Math.cos(rad), ky0 = cy + kneeR * Math.sin(rad);
      const side = Math.cos(rad) >= 0 ? 'right' : 'left';
      const lx = side === 'right' ? W - 6 : 6;
      return { ...a, rad, ex, ey, kx, ky0, side, lx };
    });
    // 同侧按 y 排序，强制最小间距，避免标注重叠
    ['right', 'left'].forEach(s => {
      const g = items.filter(it => it.side === s).sort((a, b) => a.ky0 - b.ky0);
      const minGap = 20;
      for (let k = 1; k < g.length; k++) {
        if (g[k].ky0 - g[k - 1].ky0 < minGap) g[k].ky0 = g[k - 1].ky0 + minGap;
      }
      if (g.length) {
        const top = cy - 94, bot = cy + 94;
        const over = g[g.length - 1].ky0 - bot;
        if (over > 0) g.forEach(it => it.ky0 -= over);
        const under = top - g[0].ky0;
        if (under > 0) g.forEach(it => it.ky0 += under);
      }
    });
    let groups = '';
    items.forEach(it => {
      const cat = cats[it.i];
      const tip = `${this._escapeHtml(cat.name)}: ¥${this._money(cat.value)}`;
      const slice = it.single
        ? `<circle class="donut-slice" data-idx="${it.i}" data-mid="${it.mid}" cx="${cx}" cy="${cy}" r="${(r + inner) / 2}" fill="none" stroke="${it.color}" stroke-width="${r - inner}"><title>${tip}</title></circle>`
        : `<path class="donut-slice" data-idx="${it.i}" data-mid="${it.mid}" d="${it.d}" fill="${it.color}" stroke="#fff" stroke-width="2"><title>${tip}</title></path>`;
      const leader = `<polyline class="donut-leader" points="${it.ex.toFixed(1)},${it.ey.toFixed(1)} ${it.kx.toFixed(1)},${it.ky0.toFixed(1)} ${it.lx},${it.ky0.toFixed(1)}" stroke="${it.color}"/>`;
      const anchor = it.side === 'right' ? 'end' : 'start';
      const tx = it.lx;
      const label = `<text class="donut-lab ct-lab-svg" x="${tx.toFixed(1)}" y="${(it.ky0 + 1).toFixed(1)}" text-anchor="${anchor}" onclick="event.stopPropagation();app.showColTop('${cat.key}')" title="看这一项花得最多的 5 笔">
        <tspan class="donut-lab-name" fill="${it.color}">${this._escapeHtml(cat.name)}</tspan><tspan class="donut-lab-val" dx="5">¥${this._money(cat.value)}</tspan>
      </text>`;
      groups += `<g class="donut-item" data-idx="${it.i}" onclick="app.showColTop('${cat.key}')" onmouseenter="app.highlightDonut(${it.i},true)" onmouseleave="app.highlightDonut(-1,true)">${slice}${leader}${label}</g>`;
    });
    const svg = `<svg viewBox="0 0 ${W} ${H}" class="donut" data-active="">
      ${groups}
      <text x="${cx}" y="${cy - 4}" text-anchor="middle" class="donut-total">¥${this._money(grandTotal)}</text>
      <text x="${cx}" y="${cy + 14}" text-anchor="middle" class="donut-label">总支出</text>
    </svg>`;
    return `<div class="donut-wrap">${svg}</div>`;
  }

  // 悬停高亮对应扇区（idx=-1 = 移出重置）。
  // 注意：v8.21 起「点击」扇区改为弹单项 Top5（app.showColTop），不再锁定高亮。
  highlightDonut(idx, isHover) {
    const svg = document.querySelector('#summaryContent .donut');
    if (!svg) return;
    const cur = svg.getAttribute('data-active');
    const pinned = cur !== '';
    let active;
    if (isHover) {
      if (pinned) return; // 已锁定某扇区时，悬停不覆盖
      active = idx; // idx=-1（鼠标移出）即重置
    } else {
      // 点击：已锁定同一项则取消，否则锁定该项
      active = (pinned && parseInt(cur) === idx) ? -1 : idx;
    }
    svg.setAttribute('data-active', active === -1 ? '' : String(active));
    const items = svg.querySelectorAll('.donut-item');
    items.forEach(g => {
      const i = g.getAttribute('data-idx');
      const slice = g.querySelector('.donut-slice');
      const mid = parseFloat(slice.getAttribute('data-mid') || '0');
      const a = (mid - 90) * Math.PI / 180;
      if (active === -1) {
        g.style.opacity = '1';
        slice.style.transform = 'translate(0,0)';
      } else if (i === String(active)) {
        g.style.opacity = '1';
        slice.style.transform = `translate(${(Math.cos(a) * 8).toFixed(2)}, ${(Math.sin(a) * 8).toFixed(2)})`;
      } else {
        g.style.opacity = '0.3';
        slice.style.transform = 'translate(0,0)';
      }
    });
  }

  _renderSummaryBar() {
    const cats = this._getCategories();
    if (cats.length === 0) return '<div class="analytics-empty">本月还没有花销记录</div>';
    const max = Math.max(...cats.map(c => c.value), 1);
    return cats.map((d, i) => {
      const pct = Math.max(3, Math.round(d.value / max * 100));
      const overBudget = d.budget > 0 && d.value > d.budget;
      return `<div class="sumbar-row">
        <span class="sumbar-label ct-click" onclick="app.showColTop('${d.key}')" title="看这一项花得最多的 5 笔">${this._escapeHtml(d.name)}<i class="ct-cue">▸</i></span>
        <div class="sumbar-track"><div class="sumbar-fill" style="width:${pct}%;background:${this._palette(i)}"></div></div>
        <span class="sumbar-val">¥${this._money(d.value)}</span>
        ${overBudget ? '<span class="sumbar-over">⚠️</span>' : ''}
      </div>`;
    }).join('');
  }

  _renderSummaryTable(grandTotal) {
    let html = '';
    this.columns.forEach(c => {
      const total = this.getColTotal(c.key);
      const budget = c.budget || 0;
      const overBudget = budget > 0 && total > budget;
      html += `<div class="summary-row">
        <span class="summary-label ct-click" onclick="app.showColTop('${c.key}')" title="看这一项花得最多的 5 笔">${this._escapeHtml(c.name)}<i class="ct-cue">▸</i></span>
        <span class="summary-val${overBudget ? ' expense' : ''}">
          ¥${this._money(total)}
          ${budget > 0 ? ` <span style="font-size:11px;font-weight:400;color:var(--ink-2);">/ 预算 ¥${budget}</span>` : ''}
          ${overBudget ? ' ⚠️超支' : ''}
        </span>
      </div>`;
    });

    html += '<div style="border-top:1px dashed var(--line);margin:8px 0;"></div>';

    const zhangCol = this.columns.find(c => c.name === '张');
    if (zhangCol) {
      const zhangTotal = this.getColTotal(zhangCol.key);
      html += `<div class="summary-row" style="background:var(--mint-soft);border-radius:6px;padding:8px var(--r-sm);">
        <span class="summary-label">📌 ${zhangCol.name} 单独合计</span>
        <span class="summary-val highlight">¥${this._money(zhangTotal)}</span>
      </div>`;
    }

    html += `<div class="summary-row" style="margin-top:8px;">
      <span class="summary-label">📉 总支出</span>
      <span class="summary-val expense">¥${this._money(grandTotal)}</span>
    </div>`;
    // 收入 / 扣款项：按各自 +/− 符号展示（结余统一在 footer 显示，避免重复）
    this._getTrackingItems().forEach(it => {
      const isMinus = it.sign === '-';
      const signChar = isMinus ? '−' : '＋';
      const color = isMinus ? 'var(--danger)' : 'var(--good)';
      html += `<div class="summary-row">
        <span class="summary-label">${it.icon} ${it.label} <b style="color:${color};">${signChar}</b></span>
        <span class="summary-val ${isMinus ? 'expense' : 'income'}">${isMinus ? '-' : '+'}¥${this._money(it.value)}</span>
      </div>`;
    });
    return html;
  }

  /** 某一项本月花得最多的 N 笔（从大到小）。0 值与空值不算。 */
  getColTopItems(colKey, n) {
    const list = [];
    for (let d = 1; d <= 31; d++) {
      const row = this.entries[String(d)];
      if (!row) continue;
      const v = parseFloat(row[colKey]);
      if (isNaN(v) || v === 0) continue;
      const note = (this.cellNotes[String(d)] || {})[colKey] || '';
      list.push({ day: d, value: this._round2(v), note: note });
    }
    list.sort((a, b) => b.value - a.value);   // 金额从大到小
    return typeof n === 'number' ? list.slice(0, n) : list;
  }

  /** 点汇总里的项目名 → 弹出这一项本月花得最多的 5 笔（v8.20） */
  showColTop(colKey) {
    const col = this.columns.find(c => c.key === colKey);
    if (!col) return;
    const all = this.getColTopItems(colKey);
    const top = all.slice(0, 5);
    const total = this.getColTotal(colKey);

    const t = document.getElementById('colTopTitle');
    if (t) t.textContent = '📊 ' + col.name + ' · 本月花得最多';

    let html;
    if (!all.length) {
      html = '<div class="ct-empty">这一项本月还没有记录</div>';
    } else {
      html = top.map((it, i) => `<div class="ct-row">
        <span class="ct-rank">${i + 1}</span>
        <span class="ct-day">${it.day} 号</span>
        <span class="ct-note">${this._escapeHtml(it.note)}</span>
        <span class="ct-val">¥${this._money(it.value)}</span>
      </div>`).join('');
      html += `<div class="ct-foot">本月共 <b>${all.length}</b> 笔 · 合计 <b>¥${this._money(total)}</b></div>`;
    }

    const box = document.getElementById('colTopBody');
    if (box) box.innerHTML = html;
    const ov = document.getElementById('colTopModal');
    if (ov) ov.classList.remove('hidden');
  }

  closeColTop() {
    const ov = document.getElementById('colTopModal');
    if (ov) ov.classList.add('hidden');
  }

  switchSummaryView(mode) {
    if (!['pie','bar','table'].includes(mode)) return;
    this.summaryView = mode;
    this.renderSummary();
  }

  // ── Receipt ──
  generateReceipt() {
    const grandTotal = this.getGrandTotal();
    const netIncome = this.getNetIncome();
    const balance = netIncome - grandTotal;
    const noSpendDays = this.getNoSpendDays();

    // Find zhang column
    const zhangCol = this.columns.find(c => c.name === '张');
    const zhangTotal = zhangCol ? this.getColTotal(zhangCol.key) : 0;

    let catRows = '';
    this.columns.forEach(c => {
      const total = this.getColTotal(c.key);
      catRows += `<tr><td class="cat">${this._escapeHtml(c.name)}</td><td class="amt">¥${this._money(total)}</td></tr>`;
    });

    const now = new Date();
    const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;

    const noSpendHtml = noSpendDays.length > 0
      ? `<div class="receipt-no-spend">🟢 本月无花销日: ${noSpendDays.length} 天 ✨</div>`
      : '';

    const receiptHTML = `
      <div class="receipt" id="receiptCard">
        <div class="receipt-header">
          <div class="title">🧾 月结小票</div>
          <div class="month">${this.year}年 ${this.month}月</div>
        </div>
        <hr class="receipt-divider">
        <table class="receipt-table">
          ${catRows}
          ${zhangCol ? `<tr class="subtotal-row"><td class="cat">📌 ${zhangCol.name} 小计</td><td class="amt">¥${this._money(zhangTotal)}</td></tr>` : ''}
          <tr class="total-row"><td class="cat">📉 总支出</td><td class="amt">¥${this._money(grandTotal)}</td></tr>
        </table>
        ${noSpendHtml}
        <hr class="receipt-divider">
        <div class="receipt-summary">
          ${this._getTrackingItems().map(it => `<div class="line"><span>${it.icon} ${it.label} ${it.sign === '-' ? '−' : '＋'}</span><span>${it.sign === '-' ? '-' : '+'}¥${this._money(it.value)}</span></div>`).join('')}
          <div class="line final"><span>💰 本月结余</span><span class="val">¥${this._money(balance)}</span></div>
        </div>
        <div class="receipt-tear">
          ✂️ ··················<br>
          生成于 ${dateStr}
        </div>
      </div>
    `;

    document.getElementById('receiptContainer').innerHTML = receiptHTML;
    document.getElementById('receiptModal').classList.remove('hidden');
  }

  closeReceipt() {
    document.getElementById('receiptModal').classList.add('hidden');
  }

  _loadHtml2Canvas() {
    return new Promise((resolve, reject) => {
      if (typeof html2canvas !== 'undefined') return resolve();
      const s = document.createElement('script');
      s.src = 'https://html2canvas.hertzen.com/dist/html2canvas.min.js';
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('CDN 不可达'));
      document.head.appendChild(s);
    });
  }

  async saveReceipt() {
    const card = document.getElementById('receiptCard');
    if (!card) return;
    this.showToast('正在生成图片...');
    try {
      if (typeof html2canvas === 'undefined') await this._loadHtml2Canvas();
      const canvas = await html2canvas(card, {
        backgroundColor: '#fffef9', scale: 2, useCORS: true, logging: false,
      });
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `记账小票_${this.year}年${this.month}月.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        this.showToast('✅ 已保存到下载目录！');
      }, 'image/png', 1.0);
    } catch(e) {
      this.showToast('❌ 图片生成失败：请检查网络后重试，或直接截图保存');
    }
  }

  clearMonth() {
    if (!confirm(
      `确定要清空 ${this.year}年${this.month}月 的所有数据吗？\n\n` +
      `放心，清空前会自动存一份到「🛡️ 数据保险箱 → 回收站」，7 天内还能还原。`
    )) return;

    // 先落盘并压入回收站，保证误操作可还原
    this.saveData();
    const snapshot = localStorage.getItem(this.storageKey);
    if (snapshot) this._trashPush(`${this.year}年${this.month}月`, { [this.storageKey]: snapshot });

    this.entries = {};
    for (let d = 1; d <= 31; d++) {
      const row = {};
      this.columns.forEach(c => { row[c.key] = ''; });
      this.entries[String(d)] = row;
    }
    this.cellNotes = {};
    this.salary = '';
    this.insurance = '';
    this.housingFund = '';
    this.incomeItems = this._defaultIncomeItems('', '', '', null);
    this.trackingSigns = { salary:'+', insurance:'+', housingFund:'+' };
    this.saveData();
    this.render();
    this.showToast('已清空本月数据');
  }

  // ── 测试数据（用于直观查看「统计分析」图表效果） ──
  fillDemoData() {
    if (!confirm('将生成最近 6 个月的示例数据（会覆盖这 6 个月的现有数据），用于查看统计分析图表效果。\n\n确认继续？')) return;

    const now = new Date();
    const cols = JSON.parse(JSON.stringify(DEFAULT_COLUMNS));
    const baseMap = { '食':38, '自己':25, '行':18, '自用':35, '家用':70, '生活费':45, '学':30, '医':22, '张':60, '借':35 };
    let created = 0;

    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const y = d.getFullYear(), m = d.getMonth() + 1;
      const daysInMonth = new Date(y, m, 0).getDate();
      const maxDay = (i === 0) ? now.getDate() : daysInMonth; // 当月只填到今天

      const entries = {};
      for (let day = 1; day <= 31; day++) {
        const row = {};
        cols.forEach(c => {
          // 留出部分空白天，形成「无花销日」
          if (day <= maxDay && Math.random() > 0.42) {
            const base = baseMap[c.name] || 30;
            row[c.key] = String(Math.round(base * (0.5 + Math.random())));
          } else {
            row[c.key] = '';
          }
        });
        entries[String(day)] = row;
      }

      const data = {
        columns: cols,
        nextColId: 0,
        entries,
        notes: {},
        salary: String(11500 + Math.floor(Math.random() * 1200)),
        insurance: '850',
        housingFund: '1500',
        trackingSigns: { salary:'+', insurance:'+', housingFund:'+' },
        incomeItems: [
          { id:'salary',      name:'工资',   icon:'💵', amount: String(11500 + Math.floor(Math.random() * 1200)), sign:'+' },
          { id:'insurance',   name:'保险',   icon:'🛡️', amount:'850',  sign:'+' },
          { id:'housingFund', name:'公积金', icon:'🏠', amount:'1500', sign:'+' },
        ],
        demo: true,
      };
      localStorage.setItem(`ledger_v2_${y}_${String(m).padStart(2,'0')}`, JSON.stringify(data));
      created++;
    }

    this.loadData();
    this.render();
    this.showToast(`✅ 已生成最近 ${created} 个月的测试数据`);
  }

  clearDemoData() {
    if (!confirm('将删除所有「测试数据」月份（只清除由「填充测试数据」生成的月份，不影响你手动记录的月份）。\n\n确认继续？')) return;

    const keys = [];
    for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
    let removed = 0;
    keys.forEach(k => {
      if (!/^ledger_v2_\d{4}_\d{2}$/.test(k)) return;
      try {
        const d = JSON.parse(localStorage.getItem(k));
        if (d && d.demo === true) { localStorage.removeItem(k); removed++; }
      } catch(e) {}
    });

    this.loadData();
    this.render();
    this.showToast(removed ? `🧹 已清除 ${removed} 个月的测试数据` : '没有找到测试数据');
  }

  showToast(msg) {
    const toast = document.getElementById('oldToast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  showSmartToast(msg, type, emoji) {
    type = type || 'info';
    emoji = emoji || '💡';
    const container = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = `smart-toast ${type}`;
    el.innerHTML = `<span class="ta-emoji">${emoji}</span><span class="ta-body">${msg}</span>`;
    container.appendChild(el);
    setTimeout(() => { if (el.parentNode) el.remove(); }, 4200);
    // Keep max 3 toasts
    const toasts = container.querySelectorAll('.smart-toast');
    if (toasts.length > 3) toasts[0].remove();
  }

  // ── Festival / Season Context ──
  _getFestivalContext() {
    const now = new Date();
    const m = now.getMonth() + 1;
    const d = now.getDate();
    const w = now.getDay();

    // Solar terms (simplified approximate dates)
    const terms = {
      '1,6': ['小寒','寒冬腊月，注意保暖呀 ❄️'],
      '1,20': ['大寒','一年最冷的时候，对自己好一点 🧣'],
      '2,4': ['立春','春天来了，万物复苏 🌱'],
      '2,19': ['雨水','春雨贵如油，花钱也是投资自己 🌧️'],
      '3,6': ['惊蛰','春雷响，万物长，你的钱包也在生长 ⚡'],
      '3,21': ['春分','昼夜平分，收支也要平衡哦 🌸'],
      '4,5': ['清明','清明时节，踏青赏春 🍃'],
      '4,20': ['谷雨','雨生百谷，播种好习惯 🌾'],
      '5,5': ['立夏','夏天到了，冰棍钱准备好了吗 🍦'],
      '5,21': ['小满','小满胜万全，知足常乐 🌾'],
      '6,6': ['芒种','芒种忙种，辛勤付出会有回报 🌻'],
      '6,21': ['夏至','最长的一天，预算也要拉长看 ☀️'],
      '7,7': ['小暑','天热了，空调费要算进去哟 🌡️'],
      '7,23': ['大暑','大暑天，对自己好一点不过分 🔥'],
      '8,7': ['立秋','秋天第一杯奶茶，该喝就喝 🍂'],
      '8,23': ['处暑','暑气渐消，消费也要冷静下来啦 🍃'],
    };

    // Check if today is a solar term (±1 day tolerance)
    for (const [key, [name, msg]] of Object.entries(terms)) {
      const [tm, td] = key.split(',').map(Number);
      if (m === tm && Math.abs(d - td) <= 1) {
        return { festival: name, msg, isHoliday: true };
      }
    }

    // Fixed holidays
    const holidays = {
      '1,1': ['元旦','新年第一天，开心就好 🎉'],
      '2,14': ['情人节','有爱的一天，花点钱怎么了 💝'],
      '3,8': ['妇女节','女神节快乐，今天你最大 👑'],
      '5,1': ['劳动节','劳动最光荣，休息最快乐 🛋️'],
      '6,1': ['儿童节','谁还不是个宝宝呢 🍭'],
      '8,1': ['建军节','致敬最可爱的人 🇨🇳'],
      '10,1': ['国庆节','祖国生日快乐，你也快乐 🎂'],
      '12,25': ['圣诞节','圣诞快乐，给自己的礼物不算乱花 🎄'],
    };

    for (const [key, [name, msg]] of Object.entries(holidays)) {
      const [hm, hd] = key.split(',').map(Number);
      if (m === hm && d === hd) {
        return { festival: name, msg, isHoliday: true };
      }
    }

    // Lunar festivals (approximate 2026 solar dates)
    const lunar2026 = {
      '2,17': ['除夕','年夜饭不怕花钱，团团圆圆最重要 🧧'],
      '2,18': ['春节','过年啦！压岁钱和红包都是好兆头 🧨'],
      '4,5': ['清明节','清明踏青，心情好比什么都重要 🌿'],
      '6,19': ['端午节','粽子好吃不贵，端午节安康 🫔'],
      '9,25': ['中秋节','月圆人团圆，月饼配茶刚刚好 🥮'],
    };
    for (const [key, [name, msg]] of Object.entries(lunar2026)) {
      const [lm, ld] = key.split(',').map(Number);
      if (m === lm && Math.abs(d - ld) <= 1) {
        return { festival: name, msg, isHoliday: true };
      }
    }

    // Weekend
    if (w === 0 || w === 6) {
      return { festival: '周末', msg: '周末嘛，放松一下天经地义 ☕', isHoliday: true };
    }

    // Season vibes
    const seasonMap = {
      3: '春天来了，花钱也是播种 🌸', 4: '最美四月天 🌿', 5: '初夏微风正好 🍃',
      6: '盛夏光年，热烈地生活 ☀️', 7: '炎炎夏日也要精致 🍉', 8: '八月未央，且行且珍惜 🌻',
      9: '秋高气爽，钱包也要清爽 🍂', 10: '金秋十月，收获的季节 🍁',
      11: '入冬了，囤点温暖吧 🧣', 12: '年末了，给自己一个完美收官 ✨',
      1: '新年新气象 💫', 2: '二月春风似剪刀 ✂️',
    };

    return { festival: '', msg: seasonMap[m] || '每一天都值得认真对待 ✨', isHoliday: false };
  }

  // ── Daily Budget Check ──
  checkDailyBudget() {
    const today = new Date();
    const todayDay = today.getDate();
    const isThisMonth = (today.getFullYear() === this.year && today.getMonth() + 1 === this.month);
    if (!isThisMonth) return;

    const daysInMonth = new Date(this.year, this.month, 0).getDate();
    const remainingDays = daysInMonth - todayDay + 1;
    if (remainingDays <= 0) return;

    const ctx = this._getFestivalContext();
    const row = this.entries[String(todayDay)] || {};
    const hasData = this.columns.some(c => row[c.key] && row[c.key] !== '');

    if (!hasData) {
      // No spending today yet - gentle prompt
      this.showSmartToast(
        `${ctx.msg}<br>今天还没记账呢，来记录一下吧 📝`,
        'info', '📋'
      );
      return;
    }

    // Check each category that has spending today
    this.columns.forEach(c => {
      const todayVal = parseFloat(row[c.key]) || 0;
      if (todayVal === 0) return;

      const budget = c.budget || 0;
      if (budget === 0) return;

      const spentSoFar = this.getColTotal(c.key);
      const remaining = budget - spentSoFar;
      const dailyBudget = remaining / remainingDays;

      // Already exceeded total budget
      if (remaining < 0) {
        const msgs = [
          `醒一醒！${c.name}已经超预算 ¥${this._money(Math.abs(remaining))} 了 🚨`,
          `${c.name}的预算已经炸了，先冷静一下再花钱 💸`,
          `喂喂喂，${c.name}超支 ¥${this._money(Math.abs(remaining))}，该醒醒了！`,
        ];
        this.showSmartToast(msgs[Math.floor(Math.random() * msgs.length)], 'danger', '🚨');
        return;
      }

      // Over today's budget
      if (todayVal > dailyBudget) {
        if (ctx.isHoliday) {
          const msgs = [
            `${c.name}今天花了 ¥${this._money(todayVal)}，虽然超了日均 ¥${this._money(dailyBudget)}，但${ctx.festival || '休息日'}嘛，犒劳一下自己应该的 💆`,
            `${ctx.festival || '放假'}就该好好享受！${c.name}今天 ¥${this._money(todayVal)} 花得值 🌟`,
            `休息的时候就是要对自己好一点～${c.name} ¥${this._money(todayVal)}，开心就好 ✨`,
          ];
          this.showSmartToast(msgs[Math.floor(Math.random() * msgs.length)], 'love', '💆‍♀️');
        } else {
          const over = this._money(todayVal - dailyBudget);
          const msgs = [
            `${c.name}今天花了 ¥${this._money(todayVal)}，比日均预算多了 ¥${over}，后面几天省着点哟 😉`,
            `今天${c.name} ¥${this._money(todayVal)} 稍微超了点，日均还剩 ¥${this._money(dailyBudget)}，注意节奏 🎯`,
          ];
          this.showSmartToast(msgs[Math.floor(Math.random() * msgs.length)], 'warn', '⚡');
        }
        return;
      }

      // Under budget - encourage!
      if (todayVal <= dailyBudget * 0.8 && remainingDays > 1) {
        const msgs = [
          `太棒了！${c.name}今天只花了 ¥${this._money(todayVal)}，控制在日均 ¥${this._money(dailyBudget)} 以内，继续保持 👏`,
          `${c.name}今天很克制呢，¥${this._money(todayVal)} 花得漂亮！剩余 ¥${this._money(remaining)} 可以用 ${remainingDays} 天 🌟`,
          `你是理财小能手！${c.name}今天 ¥${this._money(todayVal)} 省下不少，给自己点个赞 👍`,
        ];
        this.showSmartToast(msgs[Math.floor(Math.random() * msgs.length)], 'info', '🌟');
      }
    });
  }
}
