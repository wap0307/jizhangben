<title>📒 月记账本</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Ctext%20x='16'%20y='24'%20font-size='24'%20text-anchor='middle'%3E%F0%9F%93%92%3C/text%3E%3C/svg%3E">

<style>
:root {
  --cream:#FAF5EC; --cream-2:#F4ECDD; --paper:#FFFFFF;
  --mint:#7FD1B9; --mint-dark:#4FAE91; --mint-soft:#DCF3EB;
  --coral:#FFB5A7; --coral-soft:#FFE3DC;
  --ink:#5A4A42; --ink-2:#7A6A60; --ink-3:#A89B90;
  --line:#EADFCE; --line-2:#F0E7D6;
  --danger:#E8786E; --warn:#F2B544; --good:#4FAE91;
  --r:18px; --r-sm:12px;
  --shadow:0 6px 18px rgba(120,100,80,.10); --shadow-sm:0 2px 8px rgba(120,100,80,.08);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family:var(--font); color:var(--ink); background:var(--cream);
  min-height:100vh; padding-bottom:100px; font-size:15px; line-height:1.6;
  background-image:
    radial-gradient(circle at 8% 5%,  rgba(127,209,185,.07), transparent 38%),
    radial-gradient(circle at 92% 96%, rgba(255,181,167,.07), transparent 40%);
  background-attachment:fixed;
}

/* ── Header ── */
.header {
  position: sticky; top:0; z-index:100;
  background:var(--paper); border-bottom:1px solid var(--line);
  padding:0; backdrop-filter:blur(10px);
}
.header-row {
  display:flex; align-items:center; justify-content:center; gap:20px;
  height:52px; padding:0 16px;
}
.month-btn {
  width:36px; height:36px; border:none; border-radius:50%;
  background:var(--cream-2); color:var(--ink); font-size:16px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:transform 0.15s, background 0.15s;
}
.month-btn:hover { background:var(--mint-soft); }
.month-btn:active { transform:scale(0.92); }
.month-title {
  font-size:19px; font-weight:800; min-width:120px; text-align:center;
  letter-spacing:1px;
}

/* ── Container ── */
.container { max-width: 960px; margin:0 auto; padding:0 12px; }

/* ── Card ── */
.card {
  background:var(--paper); border-radius:var(--r);
  border:1.5px solid #E0D2BB;
  box-shadow:var(--shadow-sm); padding:18px; margin-bottom:14px;
}
.card-title {
  font-size:15px; font-weight:700; margin-bottom:14px;
  display:flex; align-items:center; gap:8px; color:var(--ink);
  padding-bottom:10px; border-bottom:1px dashed var(--line);
  flex-wrap:wrap;   /* 窄屏时右侧按钮自动换行，不挤成一团 */
}
.card-title .icon { font-size:18px; }
/* 标题行里的灰色提示小字（窄屏隐藏，给按钮腾地方） */
.title-hint {
  font-size:11px; color:var(--ink-2); font-weight:400;
}

/* ── Budget / Column Management ── */
.budget-toggle {
  font-size:13px; color: var(--mint-dark); cursor:pointer; margin-left:10px;
  user-select:none; font-weight:500; white-space:nowrap;
}
.budget-card-title { cursor:pointer; user-select:none; }
.budget-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(155px,1fr)); gap:8px;
}
/* 类别项：类别名 + 预算金额 同一行（卡片已叫「预算」，内部不再重复写"预算"二字） */
.budget-item {
  background: var(--cream); border-radius:8px;
  padding:8px 26px 8px var(--r-sm);   /* 右侧留位给删除按钮 */
  display:flex; flex-direction:row; align-items:center; gap:6px; flex-wrap:wrap;
  position:relative;
}
.budget-item-row {
  display:flex; align-items:center; gap:3px; margin-left:auto;
}
.budget-prefix {
  font-size:12px; font-weight:700; color:var(--ink-2);
  font-family:"SF Mono","Menlo",monospace;
}
.budget-name-input {
  flex:1; border:1px solid transparent; border-radius:5px;
  padding:3px 6px; font-size:13px; font-weight:600; background:transparent;
  color: var(--ink); min-width:0;
  transition: border-color 0.15s, background 0.15s;
}
.budget-name-input:focus {
  outline:none; border-color: var(--mint-dark); background:#fff;
}
.budget-amount-input {
  width:62px; border:1px solid var(--line); border-radius:6px;
  padding:4px 6px; font-size:13px; text-align:right; background:#fff;
  font-family: "SF Mono","Menlo","Consolas",monospace;
}
/* 总预算实时展示（内联徽章，放在标题行右侧，不占整行） */
.budget-total {
  margin-left:auto; display:inline-flex; align-items:center; gap:6px;
  padding:3px 12px; border-radius:20px;
  background:linear-gradient(135deg, var(--mint-soft), #fff);
  border:1px solid var(--mint); white-space:nowrap;
}
.budget-total .bt-label { font-size:12px; font-weight:600; color:var(--mint-dark); }
.budget-total .bt-value { font-size:14px; font-weight:700; color:var(--ink); font-family:"SF Mono","Menlo",monospace; }
/* 徽章警示态（如「从未备份」「欠款」）：珊瑚色 */
.budget-total.coral {
  background:linear-gradient(135deg, #FDEBE4, #fff); border-color:var(--danger);
}
.budget-total.coral, .budget-total.coral .bt-value { color:var(--danger); }
/* 自动保存状态条 */
.save-bar {
  max-width:560px; margin:8px auto 0; padding:6px 14px;
  text-align:center; font-size:12px; color:var(--ink-2);
  background:var(--mint-soft); border-radius:20px;
}
.save-bar b { color:var(--mint-dark); }
.budget-amount-input:focus { outline:none; border-color: var(--mint-dark); }
.del-col-btn {
  position:absolute; top:4px; right:6px;
  width:20px; height:20px; border:none; border-radius:50%;
  background:transparent; color:var(--ink-2); font-size:14px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  opacity:0.4; transition: opacity 0.15s, color 0.15s;
}
.del-col-btn:hover { opacity:1; color: var(--danger); }
.add-col-card {
  background: var(--cream); border:2px dashed var(--line); border-radius:8px;
  padding:8px var(--r-sm); display:flex; align-items:center; justify-content:center;
  cursor:pointer; color: var(--ink-2); font-size:13px;
  transition: border-color 0.15s, color 0.15s; min-height:65px;
}
.add-col-card:hover { border-color: var(--mint-dark); color: var(--mint-dark); }

/* ── No-Spend Stats Bar ── */
.no-spend-bar {
  display:flex; align-items:center; gap:8px;
  padding:8px 12px; background: var(--mint-soft);
  border-radius:8px; font-size:13px; color: var(--mint-dark);
  margin-bottom:8px; flex-wrap:wrap;
}
.no-spend-bar .count { font-size:20px; font-weight:700; }

/* ── Calendar ── */
.calendar-wrap { border-radius: var(--r); overflow:hidden; }
.calendar-weekdays {
  display:grid; grid-template-columns:repeat(7,1fr);
  background:#faf7f1; border-bottom:2px solid var(--line);
  padding:8px 0; text-align:center; font-size:12px; font-weight:600;
  color:var(--ink-2);
}
.calendar-weekdays span:last-child,
.calendar-weekdays span:nth-child(6) { color:var(--danger); }
.calendar-grid {
  display:grid; grid-template-columns:repeat(7,1fr);
  gap:2px; background:var(--line); padding:2px;
}
.calendar-cell {
  aspect-ratio:1; background:var(--paper);
  border-radius:6px; cursor:pointer; padding:4px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition: transform 0.12s, box-shadow 0.12s; position:relative;
  min-height:0; overflow:hidden;
}
.calendar-cell:active { transform:scale(0.94); }
.calendar-cell.other-month {
  opacity:0.25; pointer-events:none;
}
.calendar-cell.today {
  box-shadow: inset 0 0 0 2px var(--mint-dark);
}
.calendar-cell.has-spend {
  background:var(--mint-soft);
}
.calendar-cell.no-spend {
  background:var(--mint-soft);
}
.calendar-cell.future {
  opacity:0.45; cursor:default;
}
.cal-cell-date {
  font-size:14px; font-weight:700; line-height:1; color:var(--ink);
}
.calendar-cell.other-month .cal-cell-date { color:var(--ink-2); }
.cal-cell-amount {
  font-size:11px; font-weight:600; color:var(--mint-dark);
  font-family:"SF Mono","Menlo","Consolas",monospace;
  margin-top:1px; line-height:1.2; white-space:nowrap;
}
.cal-cell-badge {
  font-size:9px; font-weight:700; color:var(--mint-dark);
  margin-top:1px; white-space:nowrap;
}
.cal-cell-note-dot {
  position:absolute; top:4px; right:5px;
  width:6px; height:6px; border-radius:50%; background:var(--mint-dark);
}
.cal-cell-weekend .cal-cell-date { color:var(--danger); }
.cal-cell-today-badge {
  position:absolute; top:3px; left:4px;
  font-size:8px; color:var(--mint-dark); font-weight:700;
}

/* ── View Toggle ── */
.view-toggle {
  display:flex; gap:4px; margin-bottom:4px;
}
.view-toggle button {
  flex:1; padding:6px 12px; border:1px solid var(--line); border-radius:8px;
  background:var(--paper); font-size:12px; cursor:pointer; font-weight:500;
  transition:all 0.15s;
}
.view-toggle button.active {
  background:var(--mint-dark); color:#fff; border-color:var(--mint-dark);
}
.view-toggle button:not(.active):hover { border-color:var(--mint-dark); color:var(--mint-dark); }

/* ── Ledger Table (kept for table view) ── */
.table-wrap {
  overflow-x:auto; -webkit-overflow-scrolling:touch;
  border-radius: var(--r);
}
.table-wrap::-webkit-scrollbar { height:4px; }
.table-wrap::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px; }

table {
  width:100%; min-width:900px; border-collapse:collapse;
  font-size:13px; table-layout:fixed;
}
thead th {
  position:sticky; top:0; background:#faf7f1; z-index:2;
  padding:8px 4px; font-size:12px; font-weight:600;
  border-bottom:2px solid var(--line); white-space:nowrap;
  color: var(--ink-2);
}
thead th:first-child { width:52px; text-align:center; }
thead th.date-col { width:52px; }
tbody td {
  padding:2px; border-bottom:1px solid #f0ebe0; text-align:center;
}
tbody td:first-child {
  font-size:11px; font-weight:500; text-align:center; padding:2px 0;
  position:relative; color: var(--ink-2);
}
tbody tr.weekend td:first-child { color: var(--danger); }
tbody tr:hover td { background:#fef9f3; }

/* ── No-Spend Row Highlight ── */
tbody tr.no-spend td {
  background: var(--mint-soft) !important;
  border-bottom-color: var(--mint);
}
tbody tr.no-spend:hover td { background:#d1fae5 !important; }
tbody tr.no-spend td:first-child::after {
  content: "✨ 零花销";
  display:inline-block; margin-top:2px;
  font-size:9px; font-weight:700;
  background: var(--mint-dark); color:#fff;
  padding:1px 5px; border-radius:var(--r-sm);
  white-space:nowrap; animation: pulse-badge 2s infinite;
}
@keyframes pulse-badge {
  0%,100% { opacity:1; }
  50% { opacity:0.7; }
}

/* ── Cell Input ── */
.cell-input {
  width:100%; border:1px solid transparent; border-radius:4px;
  padding:5px 2px; font-size:13px; text-align:center;
  background:transparent; font-family: "SF Mono","Menlo","Consolas",monospace;
  transition: border-color 0.15s, background 0.15s; min-width:0;
}
.cell-input:focus {
  outline:none; border-color: var(--mint-dark); background:#fff;
  box-shadow: 0 0 0 2px var(--mint-soft);
}
.cell-input.has-value { color: var(--ink); font-weight:500; }
.cell-input.over-budget {
  background: #fef0f0; border-color: #f5c6cb;
}
.cell-input.over-budget:focus {
  border-color: var(--danger);
  box-shadow: 0 0 0 2px rgba(192,57,43,0.15);
}
tbody tr.no-spend .cell-input {
  background: transparent; border-color: transparent;
}

/* ── Row Total ── */
/* ── Cell Note Indicator ── */
.cell-wrap { position:relative; display:inline-block; width:100%; }
.cell-note-dot {
  position:absolute; bottom:1px; right:3px;
  width:7px; height:7px; border-radius:50%;
  background: var(--mint-dark);
  pointer-events:none; z-index:1;
}

/* ── Quick Entry Button ── */
.quick-entry-btn {
  display:inline-flex; align-items:center; gap:2px;
  padding:2px 8px; border:1px solid var(--line); border-radius:12px;
  background:var(--cream); font-size:11px; color:var(--ink-2);
  cursor:pointer; white-space:nowrap; transition:all 0.15s;
}
.quick-entry-btn:hover { border-color:var(--mint-dark); color:var(--mint-dark); background:var(--mint-soft); }
.quick-entry-btn.has-data { border-color:var(--mint-dark); color:var(--mint-dark); font-weight:600; }

/* ── Day Entry Modal ── */
.day-entry-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.4);
  z-index:1100; display:flex; align-items:center; justify-content:center;
  padding:20px;
}
.day-entry-overlay.hidden { display:none; }
.day-entry-card {
  background:var(--paper); border-radius:16px; padding:20px;
  max-width:420px; width:100%; max-height:85vh; overflow-y:auto;
}
.day-entry-header {
  display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;
}
.day-entry-title { font-size:16px; font-weight:700; }
.day-entry-close {
  width:32px; height:32px; border:none; border-radius:50%;
  background:var(--cream); font-size:18px; cursor:pointer;
}
.voice-section { margin-bottom:16px; }
.voice-btn {
  width:100%; padding:10px; border:2px dashed var(--line); border-radius:var(--r-sm);
  background:var(--cream); font-size:14px; cursor:pointer; transition:all 0.15s;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.voice-btn:hover { border-color:var(--mint-dark); color:var(--mint-dark); }
.voice-btn.listening {
  border-color:#e74c3c; background:#fef0f0; color:#e74c3c;
  animation: pulse-listen 1.2s infinite;
}
@keyframes pulse-listen {
  0%,100% { box-shadow: 0 0 0 0 rgba(231,76,60,0.3); }
  50% { box-shadow: 0 0 0 8px rgba(231,76,60,0); }
}
.voice-result {
  margin-top:8px; padding:8px 12px; background:var(--cream); border-radius:8px;
  font-size:12px; color:var(--ink-2); line-height:1.5;
}
.entry-grid { display:flex; flex-direction:column; gap:8px; }
.entry-row {
  display:flex; align-items:center; gap:8px;
  padding:8px 12px; background:var(--cream); border-radius:var(--r-sm);
}
.entry-row-label {
  font-size:13px; font-weight:600; min-width:44px; white-space:nowrap;
}
.entry-row-amount {
  width:72px; border:1px solid var(--line); border-radius:6px;
  padding:6px 8px; font-size:14px; text-align:right; background:#fff;
  font-family:"SF Mono","Menlo","Consolas",monospace;
}
.entry-row-amount:focus { outline:none; border-color:var(--mint-dark); }
.entry-row-note {
  flex:1; border:1px solid var(--line); border-radius:6px;
  padding:6px 8px; font-size:12px; background:#fff; min-width:0;
}
.entry-row-note:focus { outline:none; border-color:var(--mint-dark); }
.entry-row-note::placeholder { color:#ccc; }
.day-entry-actions { display:flex; gap:8px; margin-top:16px; justify-content:flex-end; }

/* ── Row Total ── */
.row-total {
  font-size:12px; font-weight:700; color: var(--mint-dark);
  padding:4px 6px; text-align:right; white-space:nowrap;
}
tbody tr.no-spend .row-total {
  color: var(--mint-dark);
}

/* ── Totals Row ── */
.totals-row td {
  border-top:2px solid var(--mint-dark); border-bottom:2px solid var(--mint-dark);
  background:#fef9f3; font-weight:700;
}
.totals-row td:first-child {
  font-size:12px; color: var(--mint-dark);
}
.totals-row .total-val {
  font-size:13px; color: var(--mint-dark); padding:8px 4px;
}

/* ── Extra Tracking ── */
.tracking-grid {
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
}
/* 收入项：名称 + ＋/− + 金额 同一行 */
.tracking-item {
  display:flex; flex-direction:row; align-items:center; gap:6px; flex-wrap:wrap;
  background:var(--cream); border:1px solid var(--line);
  border-radius:10px; padding:8px 28px 8px 10px;   /* 右侧留位给删除按钮 */
  position:relative;   /* 供右上角删除按钮定位 */
}
.tracking-item label {
  display:block; font-size:13px; font-weight:600; margin-bottom:0;
}
/* 收入项可编辑名称（与「预算」卡片一致） */
.income-name-input {
  flex:1 1 62px; width:auto; min-width:0;
  border:1px solid transparent; border-radius:6px;
  padding:3px 6px; font-size:13px; font-weight:600;
  background:transparent; color:var(--ink);
  font-family:inherit;
  transition: border-color .15s, background .15s;
}
.tracking-item input.income-name-input:focus {
  outline:none; border-color:var(--mint-dark); background:#fff;
}
.tracking-item .del-col-btn { top:6px; right:6px; }
.tracking-input-row { display:flex; align-items:center; gap:4px; margin-left:auto; }
/* 金额输入框（排除名称框，避免覆盖其"透明可编辑"样式） */
.tracking-item input:not(.income-name-input) {
  flex:1 1 64px; width:auto; min-width:0;
  border:1px solid var(--line); border-radius:8px;
  padding:7px 8px; font-size:15px; background:#fff;
  font-family: "SF Mono","Menlo","Consolas",monospace;
}
.tracking-item input:not(.income-name-input):focus { outline:none; border-color: var(--mint-dark); background:#fff; }
/* 收入/扣款加减号切换（默认加号，可切成减号） */
.sign-btn {
  width:32px; height:32px; flex:0 0 32px; border-radius:8px; cursor:pointer;
  border:1px solid var(--mint); background:var(--mint-soft); color:var(--mint-dark);
  font-size:17px; font-weight:700; line-height:1; user-select:none;
}
.sign-btn.minus {
  border-color:var(--coral); background:var(--coral-soft); color:var(--danger);
}
.sign-btn:active { transform:scale(0.94); }

/* 每日记账：固定视口高度，支持上下左右滚动，另有「展开全部」 */
.ledger-viewport {
  max-height:460px; overflow:auto; -webkit-overflow-scrolling:touch;
  border:1px solid var(--line); border-radius:12px; padding:8px;
  background:var(--paper);
}
.ledger-viewport.expanded { max-height:none; }
.ledger-viewport::-webkit-scrollbar { width:6px; height:6px; }
.ledger-viewport::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px; }
.expand-btn {
  font-size:12px; color:var(--mint-dark); background:var(--mint-soft);
  border:1px solid var(--mint); border-radius:14px; padding:4px 10px;
  cursor:pointer; white-space:nowrap;
}
/* 汇总：有数据时固定高度，避免切换视图时布局跳动 */
.summary-fixed { height:360px; overflow-y:auto; }

/* ── 卡片排序：拖标题栏 或 点 ↑ / ↓ ── */
.card-sort { display:flex; flex-direction:column; gap:2px; margin-left:auto; flex:0 0 auto; }
.card-sort button {
  width:22px; height:15px; line-height:1; font-size:10px; padding:0;
  border:1px solid var(--line); background:#fff; color:var(--ink-2);
  border-radius:4px; cursor:pointer;
}
.card-sort button:hover { border-color:var(--mint-dark); color:var(--mint-dark); }
.sortable-handle { cursor:grab; }
.sortable-handle:active { cursor:grabbing; }
/* 「预算」卡片整行可点收起，光标保持"可点"而不是"可拖" */
.budget-card-title.sortable-handle { cursor:pointer; }
.sortable-card.dragging { opacity:.4; }
.sortable-card.drag-over { outline:2px dashed var(--mint-dark); outline-offset:3px; }

/* ── 提醒与待办（Todo / 未来财务事项时间轴） ── */
.todo-alert {
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:10px 14px; margin-bottom:10px; border-radius:12px;
  font-size:13px; font-weight:600;
  background:linear-gradient(135deg, var(--coral-soft), #fff);
  border:1px solid var(--coral);
  color:var(--ink);
}
.todo-alert.calm {
  background:linear-gradient(135deg, var(--mint-soft), #fff);
  border-color:var(--mint);
}
.todo-alert .ta-num { font-size:18px; font-weight:800; color:var(--danger); }
.todo-alert.calm .ta-num { color:var(--mint-dark); }

.todo-item {
  display:flex; align-items:flex-start; gap:10px;
  padding:10px 12px; margin-bottom:8px; border-radius:12px;
  background:var(--cream); border:1px solid var(--line);
}
.todo-item.overdue-1 { border-color:var(--warn); background:#FFF8E8; }
.todo-item.overdue-2 { border-color:#EFA23C; background:#FFF1DC; }
.todo-item.overdue-3 { border-color:var(--danger); background:#FDECEA; }
.todo-item.done { opacity:.5; }

.todo-main { flex:1; min-width:0; }
.todo-title { font-size:14px; font-weight:700; color:var(--ink); }
.todo-meta {
  font-size:11px; color:var(--ink-2); margin-top:2px;
  display:flex; flex-wrap:wrap; gap:6px; align-items:center;
}
.todo-badge {
  display:inline-block; padding:1px 7px; border-radius:10px;
  font-size:11px; font-weight:700; color:#fff; white-space:nowrap;
}
.todo-amount { font-family:"SF Mono","Menlo",monospace; font-weight:700; }
.todo-amount.out { color:var(--danger); }
.todo-amount.in  { color:var(--good); }
.todo-action {
  font-size:12px; color:var(--ink); margin-top:4px;
  padding:4px 8px; background:#fff; border-radius:6px; border:1px dashed var(--line);
}
.todo-aging { font-weight:700; }
.todo-aging.a1 { color:var(--warn); }
.todo-aging.a2 { color:#EFA23C; }
.todo-aging.a3 { color:var(--danger); }

.todo-btns { display:flex; flex-direction:column; gap:4px; }
.todo-btn {
  font-size:12px; padding:4px 10px; border-radius:8px; cursor:pointer;
  border:1px solid var(--mint); background:var(--mint-soft); color:var(--mint-dark);
  white-space:nowrap;
}
.todo-btn.ghost { border-color:var(--line); background:#fff; color:var(--ink-2); }
.todo-btn.danger { border-color:var(--coral); background:var(--coral-soft); color:var(--danger); }

.todo-form {
  padding:12px; border-radius:12px; background:var(--cream-2);
  border:1px dashed var(--mint-dark); margin-bottom:10px;
}
.todo-form-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
.todo-form-row label { font-size:12px; color:var(--ink-2); font-weight:600; }
.todo-form input, .todo-form select {
  border:1px solid var(--line); border-radius:8px; padding:7px 10px;
  font-size:14px; background:#fff; color:var(--ink); font-family:inherit;
}
.todo-form input:focus, .todo-form select:focus { outline:none; border-color:var(--mint-dark); }
.todo-empty { text-align:center; padding:18px; color:var(--ink-2); font-size:13px; }

/* ── Summary ── */
.summary-row {
  display:flex; justify-content:space-between; align-items:center;
  padding:8px 0; border-bottom:1px dashed var(--line);
  font-size:14px;
}
.summary-row:last-child { border-bottom:none; }
.summary-label { color: var(--ink-2); }
.summary-val { font-weight:700; font-family:"SF Mono","Menlo","Consolas",monospace; }
.summary-val.highlight { color: var(--mint-dark); font-size:18px; }
.summary-val.income { color: var(--good); }
.summary-val.expense { color: var(--danger); }

/* ── Buttons ── */
.btn-row { display:flex; gap:10px; flex-wrap:wrap; }
.btn {
  flex:1; min-width:120px; padding:13px 20px; border:none; border-radius:var(--r-sm);
  font-size:14px; font-weight:700; cursor:pointer; transition: transform 0.15s, box-shadow 0.15s;
  display:flex; align-items:center; justify-content:center; gap:6px;
  font-family:var(--font);
}
.btn:active { transform:scale(0.96); }
.btn-primary {
  background:linear-gradient(135deg,var(--mint),var(--mint-dark));
  color:#fff; box-shadow:0 3px 12px rgba(79,174,145,.22);
}
.btn-secondary {
  background:var(--cream-2); color:var(--ink); border:1px solid var(--line);
}
.btn-green {
  background:var(--good); color:#fff;
  box-shadow:0 3px 12px rgba(79,174,145,.2);
}

/* ── Receipt Modal ── */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.5);
  z-index:1000; display:flex; align-items:center; justify-content:center;
  padding:20px;
}
.modal-overlay.hidden { display:none; }
.modal-content {
  background: var(--paper); border-radius:16px; padding:20px;
  max-width:400px; width:100%; max-height:90vh; overflow-y:auto;
}
.modal-header {
  display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;
}
.modal-title { font-size:18px; font-weight:700; }
.modal-close {
  width:32px; height:32px; border:none; border-radius:50%;
  background: var(--cream); font-size:18px; cursor:pointer;
}

/* ── Receipt Card ── */
.receipt {
  background: #fffef9;
  border:2px dashed #d4c5a0;
  border-radius:12px; padding:24px 20px;
  font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:#3d3226;
}
.receipt-header { text-align:center; margin-bottom:20px; }
.receipt-header .title { font-size:20px; font-weight:700; letter-spacing:3px; }
.receipt-header .month { font-size:14px; color:#8b7e6a; margin-top:4px; }
.receipt-divider { border:none; border-top:1px dashed #d4c5a0; margin:16px 0; }
.receipt-table { width:100%; font-size:14px; }
.receipt-table td { padding:5px 0; }
.receipt-table .cat { text-align:left; color:#5c4f3a; }
.receipt-table .amt { text-align:right; font-family:"SF Mono","Menlo","Consolas",monospace; font-weight:500; }
.receipt-table .subtotal-row td { border-top:1px solid #d4c5a0; padding-top:8px; font-weight:700; }
.receipt-table .total-row td { border-top:2px solid #d4740e; padding-top:10px; font-weight:700; font-size:16px; }
.receipt-table .total-row .amt { color:#d4740e; }
.receipt-summary { margin-top:16px; font-size:14px; }
.receipt-summary .line { display:flex; justify-content:space-between; padding:3px 0; }
.receipt-summary .line.final {
  margin-top:8px; padding-top:8px; border-top:2px solid #d4740e;
  font-size:16px; font-weight:700;
}
.receipt-summary .line.final .val { color:#d4740e; }
.receipt-tear {
  margin-top:16px; border-top:2px dotted #d4c5a0;
  padding-top:12px; text-align:center; font-size:11px; color:#b5a58a;
}
.receipt-no-spend {
  margin-top:12px; padding:8px 12px; background:#ecfdf5;
  border-radius:8px; font-size:13px; color:#059669; text-align:center;
}

.modal-actions { display:flex; gap:10px; margin-top:16px; }

/* ── 项目「花得最多 Top5」弹窗（v8.20）── */
.ct-modal { max-width:360px; width:100%; }
.ct-row { display:flex; align-items:baseline; gap:9px; padding:8px 2px; border-bottom:1px solid var(--line-2); }
.ct-row:last-of-type { border-bottom:none; }
.ct-rank { flex:none; width:17px; text-align:center; font-size:12px; font-weight:700; color:var(--ink-3); }
.ct-row:first-child .ct-rank { color:var(--mint-dark); }
.ct-day { flex:none; min-width:40px; font-size:13.5px; color:var(--ink); }
.ct-note { flex:1; font-size:11.5px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ct-val { flex:none; margin-left:auto; font-size:15px; font-weight:700; color:var(--ink); }
.ct-foot { margin-top:10px; padding-top:9px; border-top:1px dashed var(--line); font-size:12px; color:var(--ink-2); text-align:right; }
.ct-foot b { color:var(--ink); font-size:13px; }
.ct-empty { padding:20px 4px; text-align:center; color:var(--ink-3); font-size:13px; }
.ct-click { cursor:pointer; }
.ct-click:hover { color:var(--mint-dark); }
.ct-cue { font-style:normal; font-size:9px; color:var(--ink-3); margin-left:3px; vertical-align:1px; }
.ct-click:hover .ct-cue { color:var(--mint-dark); }
.ct-lab-svg { cursor:pointer; pointer-events:auto; }   /* 覆盖 .donut-lab 的 pointer-events:none，否则点不中 */

/* ── Smart Toast ── */
.toast-container {
  position:fixed; top:70px; left:50%; transform:translateX(-50%);
  z-index:3000; display:flex; flex-direction:column; gap:8px;
  pointer-events:none; width:90%; max-width:400px;
}
.smart-toast {
  background:var(--paper); border-radius:var(--r-sm);
  padding:14px 18px; box-shadow:var(--shadow);
  font-size:14px; line-height:1.5; color:var(--ink);
  display:flex; align-items:flex-start; gap:10px;
  animation: toastIn .4s ease, toastOut .4s ease 3.5s forwards;
  pointer-events:auto; position:relative; overflow:hidden;
  border-left:4px solid var(--mint);
}
.smart-toast.warn { border-left-color:var(--warn); }
.smart-toast.danger { border-left-color:var(--danger); }
.smart-toast.love { border-left-color:var(--coral); }
.smart-toast::before {
  content:''; position:absolute; bottom:0; left:0; height:3px;
  background:var(--mint-soft); animation:toastBar 4s linear forwards;
}
.smart-toast.warn::before { background:#fef0d5; }
.smart-toast.danger::before { background:var(--coral-soft); }
.smart-toast.love::before { background:var(--coral-soft); }
.smart-toast .ta-emoji { font-size:22px; flex-shrink:0; line-height:1; }
.smart-toast .ta-body { flex:1; min-width:0; }
@keyframes toastIn { from{opacity:0;transform:translateY(-12px);} to{opacity:1;transform:translateY(0);} }
@keyframes toastOut { from{opacity:1;transform:translateY(0);} to{opacity:0;transform:translateY(-12px);} }
@keyframes toastBar { from{width:100%;} to{width:0%;} }
.old-toast {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); padding:10px 24px; border-radius:20px;
  font-size:14px; z-index:2000; opacity:0; transition:opacity 0.3s;
  pointer-events:none;
}
.old-toast.show { opacity:1; }

/* ── Responsive ── */
@media (max-width:600px) {
  .container { padding:0 8px; }
  .card { padding:12px; margin-bottom:8px; }
  .title-hint { display:none; }   /* 窄屏隐藏提示小字，给标题行按钮腾地方 */
  .card-title { gap:6px; }
  .budget-grid { grid-template-columns:repeat(auto-fill, minmax(118px,1fr)); gap:6px; }
  /* 收入项内部已合并成一行，手机上三列会挤到看不清 → 改两列，保证每项仍是一行 */
  .tracking-grid { grid-template-columns:repeat(2,1fr); gap:6px; }
  .tracking-item { padding:7px 26px 7px 8px; gap:5px; }
  .tracking-item input:not(.income-name-input) { padding:6px 6px; font-size:14px; flex:1 1 54px; }
  .income-name-input { flex:1 1 44px; font-size:12px; padding:3px 4px; }
  .sign-btn { width:28px; height:28px; flex:0 0 28px; font-size:15px; }
  .budget-item { padding:7px 24px 7px 8px; gap:4px; }
  .budget-amount-input { width:54px; font-size:12px; padding:3px 4px; }
  .budget-name-input { font-size:12px; padding:2px 4px; }
  table { min-width:750px; }
  thead th { font-size:11px; padding:6px 2px; }
  .cell-input { font-size:12px; padding:4px 1px; }
  .month-title { font-size:19px; }
  tbody tr.no-spend td:first-child::after { font-size:8px; padding:1px 4px; }
  .calendar-cell { padding:3px; }
  .cal-cell-date { font-size:12px; }
  .cal-cell-amount { font-size:10px; }
  .cal-cell-badge { font-size:8px; }
  .cal-cell-note-dot { width:5px; height:5px; top:3px; right:3px; }
  .cal-cell-today-badge { font-size:7px; top:2px; left:2px; }
}
/* ── Analytics ── */
.analytics-range {
  display:flex; gap:4px; margin-bottom:14px; flex-wrap:wrap;
}
.analytics-range button {
  padding:5px 14px; border:1px solid var(--line); border-radius:16px;
  background:var(--paper); font-size:12px; cursor:pointer; font-weight:500;
  transition:all 0.15s; white-space:nowrap;
}
.analytics-range button.active {
  background:var(--mint-dark); color:#fff; border-color:var(--mint-dark);
}
.analytics-range button:not(.active):hover { border-color:var(--mint-dark); color:var(--mint-dark); }
.analytics-bar-row {
  display:flex; align-items:center; gap:10px; padding:6px 0;
  border-bottom:1px solid #f5f0e8;
}
.analytics-bar-label {
  font-size:13px; font-weight:600; min-width:44px; white-space:nowrap;
}
.analytics-bar-track {
  flex:1; height:22px; background:var(--cream); border-radius:6px; overflow:hidden; position:relative;
}
.analytics-bar-fill {
  height:100%; border-radius:6px; background:linear-gradient(90deg, #f0a050, #d4740e);
  transition: width 0.5s ease; min-width:2px; display:flex; align-items:center;
  padding-left:8px; font-size:10px; color:#fff; font-weight:600; white-space:nowrap;
}
.analytics-bar-amount {
  font-size:13px; font-weight:700; min-width:72px; text-align:right;
  font-family:"SF Mono","Menlo","Consolas",monospace;
}
.analytics-bar-avg {
  font-size:11px; color:var(--ink-2); min-width:56px; text-align:right;
}
.analytics-total {
  display:flex; justify-content:space-between; align-items:center;
  padding-top:10px; margin-top:6px; border-top:2px solid var(--mint-dark);
  font-size:15px; font-weight:700;
}
.analytics-total .val {
  font-size:20px; color:var(--mint-dark);
  font-family:"SF Mono","Menlo","Consolas",monospace;
}
.analytics-meta {
  font-size:11px; color:var(--ink-2); margin-top:6px;
}
.analytics-empty {
  text-align:center; padding:24px; color:var(--ink-2); font-size:13px;
}

/* ── Summary View Toggle ── */
.summary-toggle {
  display:flex; gap:4px; margin-bottom:14px; flex-wrap:wrap;
}
.summary-toggle button {
  flex:1; min-width:64px; padding:6px 10px; border:1px solid var(--line); border-radius:12px;
  background:var(--paper); font-size:12px; cursor:pointer; font-weight:600;
  transition:all 0.15s; white-space:nowrap; color:var(--ink-2);
}
.summary-toggle button.active {
  background:var(--mint-dark); color:#fff; border-color:var(--mint-dark);
  box-shadow: 0 2px 6px rgba(79,174,145,0.3);
}
.summary-toggle button:not(.active):hover { border-color:var(--mint-dark); color:var(--mint-dark); }

/* ── Donut Chart ── */
.donut-wrap { display:flex; justify-content:center; }
.donut { width:100%; max-width:360px; height:auto; }
.donut-item { cursor:pointer; transition: opacity .18s ease; }
.donut-slice { transition: opacity .18s ease, transform .18s ease; transform-origin:190px 110px; }
.donut-leader { fill:none; stroke-width:1.4; opacity:.85; stroke-linecap:round; stroke-linejoin:round; }
.donut-lab { font-size:13px; pointer-events:none; }
.donut-lab-name { font-weight:700; }
.donut-lab-val { font-weight:600; font-family:"SF Mono","Menlo","Consolas",monospace; font-size:11px; fill:var(--ink-2); }
.donut-total { font-size:22px; font-weight:800; fill:var(--ink); font-family:"SF Mono","Menlo","Consolas",monospace; }
.donut-label { font-size:11px; fill:var(--ink-2); }

/* ── Summary Bar Chart ── */
.sumbar-row {
  display:flex; align-items:center; gap:10px; padding:7px 0;
  border-bottom:1px solid #f5f0e8;
}
.sumbar-row:last-child { border-bottom:none; }
.sumbar-label { font-size:13px; font-weight:600; min-width:48px; white-space:nowrap; }
.sumbar-track {
  flex:1; height:24px; background:var(--cream); border-radius:8px; overflow:hidden; position:relative;
}
.sumbar-fill {
  height:100%; border-radius:8px; transition:width 0.5s ease; min-width:3px;
}
.sumbar-val {
  font-size:13px; font-weight:700; min-width:78px; text-align:right;
  font-family:"SF Mono","Menlo","Consolas",monospace;
}
.sumbar-over { min-width:18px; text-align:right; font-size:12px; }

/* ── Summary Footer (compact) ── */
.summary-footer {
  display:flex; flex-direction:column; gap:6px;
  padding-top:12px; margin-top:8px; border-top:2px solid var(--mint-dark);
  font-size:15px; font-weight:700;
}
.summary-footer .sf-row {
  display:flex; justify-content:space-between; align-items:center; gap:8px;
}
.summary-footer .sf-row .val {
  font-size:16px; font-weight:700;
  font-family:"SF Mono","Menlo","Consolas",monospace;
}
.summary-footer .sf-row .val.income { color:var(--good); }
.summary-footer .sf-row .val.expense { color:var(--danger); }
.summary-footer .sf-row.final { padding-top:6px; border-top:1px dashed var(--line); font-size:16px; }
.summary-footer .sf-row.final .val { font-size:22px; color:var(--mint-dark); }
.summary-footer .sf-row.final .val.expense { color:var(--danger); }

/* ══ 存款与外账（v8.11）══ */
.assets-summary {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-bottom:6px;
}
.assets-summary .as-cell {
  background:var(--cream); border:1px solid var(--line); border-radius:10px;
  padding:8px 10px; display:flex; flex-direction:column; gap:2px;
}
.assets-summary .as-cell .as-label { font-size:11px; color:var(--ink-2); font-weight:600; }
.assets-summary .as-cell .as-val {
  font-size:17px; font-weight:800; font-family:"SF Mono","Menlo",monospace; color:var(--ink);
}
.assets-summary .as-cell .as-val.mint  { color:var(--mint-dark); }
.assets-summary .as-cell .as-val.coral { color:var(--danger); }
.assets-summary .as-cell .as-val.warn  { color:var(--warn); }
.assets-sec { margin-top:14px; padding-top:12px; border-top:1px dashed var(--line); }
.assets-sec-title {
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  font-size:14px; font-weight:800; color:var(--ink); margin-bottom:8px;
}
.assets-sec-title .sub { font-size:11px; color:var(--ink-3); font-weight:400; }
.assets-sec-title .grow { flex:1; }
/* 存款表单（2 列网格） */
.assets-save-grid {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:8px;
}
.assets-save-grid .as-field { display:flex; flex-direction:column; gap:3px; }
.assets-save-grid .as-field label { font-size:11px; color:var(--ink-2); font-weight:600; }
.assets-save-grid input, .asset-row input, .assets-repay input {
  border:1px solid var(--line); border-radius:8px; padding:7px 9px;
  font-size:14px; background:#fff; color:var(--ink); font-family:inherit; min-width:0;
}
.assets-save-grid input:focus, .asset-row input:focus { outline:none; border-color:var(--mint-dark); }
.assets-save-grid .as-field.wide { grid-column:1/-1; }
.assets-save-grid input.num { text-align:right; font-family:"SF Mono","Menlo",monospace; }
/* 外账行 */
.asset-row {
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  background:var(--cream); border:1px solid var(--line); border-radius:10px;
  padding:7px 9px; margin-bottom:8px; position:relative;
}
.asset-row input.name { flex:1 1 110px; min-width:90px; font-weight:600; }
.asset-row input.num { width:110px; text-align:right; font-family:"SF Mono","Menlo",monospace; }
.asset-row .del-col-btn { top:4px; right:5px; }
.asset-row .tag {
  font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px; white-space:nowrap;
}
.asset-row .tag.owe  { background:var(--coral-soft); color:var(--danger); }
.asset-row .tag.recv { background:var(--mint-soft);  color:var(--mint-dark); }
.asset-row .done-mark { font-size:11px; color:var(--good); font-weight:700; }
.asset-row.cleared { opacity:.55; background:var(--cream-2); }
.asset-row.cleared input { background:transparent; color:var(--ink-3); }
.asset-row .row-actions { margin-left:auto; display:flex; gap:4px; align-items:center; }
.mini-btn {
  border:1px solid var(--line); background:#fff; border-radius:8px; padding:5px 9px;
  font-size:12px; cursor:pointer; color:var(--ink-2); white-space:nowrap;
}
.mini-btn:hover { border-color:var(--mint-dark); color:var(--mint-dark); }
.mini-btn.ok   { border-color:var(--mint); color:var(--mint-dark); background:var(--mint-soft); }

<script>
const DEFAULT_COLUMNS = [
  { key: 'col_food',     name: '食',     budget: 500 },
  { key: 'col_self',     name: '自己',   budget: 400 },
  { key: 'col_travel',   name: '行',     budget: 2000 },
  { key: 'col_self2',    name: '自用',   budget: 0 },
  { key: 'col_home',     name: '家用',   budget: 300 },
  { key: 'col_living',   name: '生活费', budget: 300 },
  { key: 'col_study',    name: '学',     budget: 200 },
  { key: 'col_medical',  name: '医',     budget: 0 },
  { key: 'col_zhang',    name: '张',     budget: 300 },
  { key: 'col_borrow',   name: '借',     budget: 0 },
];

// Migration: old Chinese-key data → new prefixed keys
const KEY_MAP = { '食':'col_food','自己':'col_self','行':'col_travel','自己2':'col_self2','家用':'col_home','生活费':'col_living','学':'col_study','医':'col_medical','张':'col_zhang','借':'col_borrow' };

// 提醒与待办：7 种事项类型（direction: out 要付 / in 要收 / neutral 只核实）
const TODO_TYPES = {
  repay:      { label:'还款',     icon:'💳', direction:'out',     color:'#E8786E' },
  bill:       { label:'缴费',     icon:'🏠', direction:'out',     color:'#E8786E' },
  salary:     { label:'发薪',     icon:'💵', direction:'in',      color:'#4FAE91' },
  claim:      { label:'报销',     icon:'🧾', direction:'in',      color:'#4FAE91' },
  refund:     { label:'退款',     icon:'↩️', direction:'in',      color:'#4FAE91' },
  verify:     { label:'核实',     icon:'🔍', direction:'neutral', color:'#F2B544' },
  receivable: { label:'应收回款', icon:'🤝', direction:'in',      color:'#4FAE91' },
};

// 卡片默认顺序（可拖动或点 ↑↓ 调整，存 ledger_layout_v1）
// 默认：收入置顶、提醒与待办置底
const CARD_ORDER_DEFAULT = ['income', 'budget', 'ledger', 'assets', 'summary', 'analytics', 'backup', 'todo'];
const CARD_NAMES = {
  income:'本月收入与扣款', budget:'预算', ledger:'每日记账',
  assets:'存款与外账', summary:'本月汇总', analytics:'统计分析',
  backup:'数据保险箱', todo:'提醒与待办',
};

class LedgerApp {
  constructor() {
    this.year = new Date().getFullYear();
    this.month = new Date().getMonth() + 1;
    this.columns = JSON.parse(JSON.stringify(DEFAULT_COLUMNS));
    this.nextColId = 0;
    this.budgetVisible = true;
    this.viewMode = 'calendar'; // calendar | table
    this.summaryView = 'pie'; // pie | bar | table
    this.analyticsRange = 'all'; // 1m | 3m | 6m | year | all
    this.trackingSigns = { salary:'+', insurance:'+', housingFund:'+' }; // 旧字段，向后兼容用
    this.incomeItems = this._defaultIncomeItems('', '', '', null);       // 收入项（可增删改，主数据）
    this.ledgerExpanded = false;
    this.todos = [];          // 提醒与待办（跨月持续状态，独立全局键）
    this.todoFormOpen = false;
    this.editingTodoId = null;
    // 存款与外账（跨月全局状态，独立全局键 ledger_assets_v1）
    this.assets = this._defaultAssets();
    this.assetsFormOpen = false;
    this.assetsEditId = null;
    // 数据保险箱（v8.12）
    this._backupHandle = null;
    this._backupPerm = null;
    this._autoBackupTimer = null;
    this._trashOpen = false;
    this._pendingImportMode = 'merge';
    this.loadData();
    this.loadTodos();
    this.loadAssets();
    this.loadLayout();
    this.applyCardOrder();
    this.render();
    // Esc to close day entry
    document.addEventListener('keydown', e => this._handleKeydown(e));
    // Click outside to close
    document.getElementById('dayEntryOverlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) this.closeDayEntry();
    });
    // 关闭/刷新前兜底保存，防止正在输入未失焦时丢失
    window.addEventListener('beforeunload', () => { this.saveData(); this.saveAssets(); });
    // 数据保险箱：恢复自动备份连接；本地为空而备份文件有数据时提示恢复
    this.initBackupLink();
    // 超过 7 天没备份，进页面时提醒一次
    const _d = this._daysSinceBackup();
    if (_d !== null && _d > 7) {
      setTimeout(() => this.showToast(`已经 ${_d} 天没备份了，去「🛡️ 数据保险箱」备份一下吧`), 1600);
    }
  }

  get storageKey() { return `ledger_v2_${this.year}_${String(this.month).padStart(2,'0')}`; }

  // Migrate old data format if present
  _migrateOldData(data) {
    const oldKey = `ledger_${this.year}_${String(this.month).padStart(2,'0')}`;
    const migrated = { entries: {} };
    if (data.entries) {
      for (const [day, row] of Object.entries(data.entries)) {
        migrated.entries[day] = {};
        for (const [oldK, val] of Object.entries(row)) {
          const newK = KEY_MAP[oldK] || oldK;
          migrated.entries[day][newK] = val;
        }
      }
    }
    return migrated;
  }

  loadData() {
    // Try v2 storage first
    let raw = localStorage.getItem(this.storageKey);
    let data = null;
    if (raw) {
      try { data = JSON.parse(raw); } catch(e) {}
    }

    // Fallback: try old key and migrate
    if (!data) {
      const oldKey = `ledger_${this.year}_${String(this.month).padStart(2,'0')}`;
      raw = localStorage.getItem(oldKey);
      if (raw) {
        try {
          const old = JSON.parse(raw);
          data = this._migrateOldData(old);
          if (old.columns) {
            data.columns = old.columns.map(c => ({
              ...c,
              key: KEY_MAP[c.key] || c.key,
            }));
          }
          if (old.salary !== undefined) data.salary = old.salary;
          if (old.insurance !== undefined) data.insurance = old.insurance;
          if (old.housingFund !== undefined) data.housingFund = old.housingFund;
          this.saveData(); // persist migrated data
        } catch(e) {}
      }
    }

    if (data) {
      if (data.columns && data.columns.length) this.columns = data.columns;
      this.nextColId = data.nextColId || 0;
      this.entries = data.entries || {};
      // 备注：新格式存在 cellNotes（{ 日: { 列key: 文本 } }）。
      // 历史版本把同一份数据写进了 notes 字段 —— 两种都要认，且【绝不能在这里清空】。
      // （2026-09-14 修的 bug：旧代码写 notes、读 cellNotes，读不到就走"旧格式迁移"把备注全清掉）
      if (data.cellNotes && typeof data.cellNotes === 'object') {
        this.cellNotes = data.cellNotes;
      } else if (data.notes && typeof data.notes === 'object') {
        const migrated = {};
        for (const [day, v] of Object.entries(data.notes)) {
          if (typeof v === 'string') {
            // 最老的格式：一天一条字符串，挂到当天第一个有金额的列上
            const row = this.entries[day] || {};
            const firstCol = this.columns.find(c => row[c.key] && row[c.key] !== '');
            if (firstCol) migrated[day] = { [firstCol.key]: v };
          } else if (v && typeof v === 'object') {
            // 新格式被写在了 notes 里 —— 原样接住（未被重载过的月份能靠这里救回来）
            migrated[day] = v;
          }
        }
        this.cellNotes = migrated;
      } else {
        this.cellNotes = {};
      }
      this.salary = data.salary || '';
      this.insurance = data.insurance || '';
      this.housingFund = data.housingFund || '';
      this.trackingSigns = Object.assign(
        { salary:'+', insurance:'+', housingFund:'+' },
        data.trackingSigns || {}
      );
      // 收入项：优先用新的动态列表；没有则从旧的三字段迁移（保证老数据不丢）
      this.incomeItems = (Array.isArray(data.incomeItems) && data.incomeItems.length)
        ? data.incomeItems
        : this._defaultIncomeItems(data.salary, data.insurance, data.housingFund, data.trackingSigns);
    } else {
      // Fresh month
      this.entries = {};
      for (let d = 1; d <= 31; d++) {
        const row = {};
        this.columns.forEach(c => { row[c.key] = ''; });
        this.entries[String(d)] = row;
      }
      this.cellNotes = {};
      this.salary = '';
      this.insurance = '';
      this.housingFund = '';
      this.trackingSigns = { salary:'+', insurance:'+', housingFund:'+' };
      this.incomeItems = this._defaultIncomeItems('', '', '', null);
    }

    // Ensure all columns have entries
    this._ensureEntries();
  }

  // 收入项默认三项（也用于从旧版三字段迁移）
  _defaultIncomeItems(salary, insurance, housingFund, signs) {
    const s = signs || {};
    return [
      { id:'salary',      name:'工资',   icon:'💵', amount: salary      != null ? String(salary)      : '', sign: s.salary      || '+' },
      { id:'insurance',   name:'保险',   icon:'🛡️', amount: insurance   != null ? String(insurance)   : '', sign: s.insurance   || '+' },
      { id:'housingFund', name:'公积金', icon:'🏠', amount: housingFund != null ? String(housingFund) : '', sign: s.housingFund || '+' },
    ];
  }

  _ensureEntries() {
    for (let d = 1; d <= 31; d++) {
      if (!this.entries[String(d)]) this.entries[String(d)] = {};
      this.columns.forEach(c => {
        if (!(c.key in this.entries[String(d)])) {
          this.entries[String(d)][c.key] = '';
        }
      });
    }
  }

  saveData() {
    this.flushActiveInput();
    // 同步旧字段：向后兼容（旧版本打开仍能看到前三项），也让迁移路径始终可用
    if (Array.isArray(this.incomeItems)) {
      const byId = id => this.incomeItems.find(x => x.id === id) || {};
      const s = byId('salary'), i = byId('insurance'), h = byId('housingFund');
      this.salary      = s.amount != null ? String(s.amount) : '';
      this.insurance   = i.amount != null ? String(i.amount) : '';
      this.housingFund = h.amount != null ? String(h.amount) : '';
      this.trackingSigns = {
        salary:      s.sign || '+',
        insurance:   i.sign || '+',
        housingFund: h.sign || '+',
      };
    }
    const data = {
      columns: this.columns,
      nextColId: this.nextColId,
      entries: this.entries,
      cellNotes: this.cellNotes,
      notes: this.cellNotes,
      salary: this.salary,
      insurance: this.insurance,
      housingFund: this.housingFund,
      trackingSigns: this.trackingSigns,
      incomeItems: this.incomeItems,
    };
    localStorage.setItem(this.storageKey, JSON.stringify(data));
    try { localStorage.setItem(this.writeAtKey, String(Date.now())); } catch (e) {}
    this.updateSaveStatus();
    this._scheduleAutoBackup();
    this._scheduleCloudPush();
  }

  // 关闭/刷新前兜底：把正在编辑但未失焦的输入框写入模型，避免丢失
  flushActiveInput() {
    const el = document.activeElement;
    if (!el || !el.id) return;
    const m = el.id.match(/^cell_(\d+)_(.+)$/);
    if (m) {
      const day = m[1], key = m[2];
      if (this.entries[String(day)]) this.entries[String(day)][key] = el.value.trim();
      return;
    }
    // 收入项：incamt_<id>
    const mi = el.id.match(/^incamt_(.+)$/);
    if (mi) {
      const it = (this.incomeItems || []).find(x => x.id === mi[1]);
      if (it) it.amount = el.value;
      return;
    }
    if (el.id === 'salaryInput') this.salary = el.value;
    else if (el.id === 'insuranceInput') this.insurance = el.value;
    else if (el.id === 'housingInput') this.housingFund = el.value;
  }

  updateSaveStatus() {
    const el = document.getElementById('saveStatus');
    if (!el) return;
    const t = new Date().toLocaleTimeString('zh-CN', { hour12:false });
    const bk = (typeof this._backupTimeText === 'function') ? this._backupTimeText() : '';
    el.innerHTML = `💾 已自动保存 · <b>${t}</b> · 数据存于本机浏览器（localStorage）${bk ? ` · 🛡️ ${bk}` : ''}`;
  }

  setMonth(delta) {
    const d = new Date(this.year, this.month - 1 + delta, 1);
    this.year = d.getFullYear();
    this.month = d.getMonth() + 1;
    this.loadData();
    this.loadTodos();   // 多标签场景下重新读取，避免待办数据不一致
    this.loadAssets();  // 资产为跨月状态，不随月份变化，但保持一致读取
    this.render();
  }

  prevMonth() { this.setMonth(-1); }
  nextMonth() { this.setMonth(1); }

  toggleBudget() {
    this.budgetVisible = !this.budgetVisible;
    const grid = document.getElementById('budgetGrid');
    const toggle = document.getElementById('budgetToggle');
    grid.style.display = this.budgetVisible ? '' : 'none';
    toggle.textContent = this.budgetVisible ? '收起 ▲' : '展开 ▼';
  }

  // ── Column Management ──
  addColumn() {
    const key = `col_new_${this.nextColId++}`;
    this.columns.push({ key, name: '新类别', budget: 0 });
    // Add this column to all existing entries
    for (let d = 1; d <= 31; d++) {
      if (!this.entries[String(d)]) this.entries[String(d)] = {};
      this.entries[String(d)][key] = '';
    }
    this.saveData();
    this.renderBudget();
    this.renderLedger();
    this.renderSummary();
  }

  deleteColumn(colKey) {
    const col = this.columns.find(c => c.key === colKey);
    if (!col) return;

    // Check if column has data
    let hasData = false;
    for (let d = 1; d <= 31; d++) {
      const v = this.entries[String(d)]?.[colKey];
      if (v && v !== '' && parseFloat(v) !== 0) { hasData = true; break; }
    }

    const warnMsg = hasData
      ? `"${col.name}" 中有已填数据，删除后数据将丢失。确认删除？`
      : `确认删除类别 "${col.name}"？`;

    if (!confirm(warnMsg)) return;

    this.columns = this.columns.filter(c => c.key !== colKey);
    // Remove this column from all entries
    for (let d = 1; d <= 31; d++) {
      if (this.entries[String(d)]) delete this.entries[String(d)][colKey];
    }
    this.saveData();
    this.renderBudget();
    this.renderLedger();
    this.renderSummary();
    this.showToast(`已删除"${col.name}"`);
  }

  onColumnNameChange(colKey) {
    const input = document.getElementById(`colname_${colKey}`);
    if (!input) return;
    const col = this.columns.find(c => c.key === colKey);
    if (col) {
      col.name = input.value.trim() || '未命名';
      this.saveData();
      this.renderLedger();
      this.renderSummary();
    }
  }

  onBudgetChange(colKey) {
    const input = document.getElementById(`budget_${colKey}`);
    if (!input) return;
    const col = this.columns.find(c => c.key === colKey);
    if (col) {
      col.budget = parseFloat(input.value) || 0;
      this.saveData();
      this.renderLedger();
      this.renderSummary();
      this.updateTotalBudget();
    }
  }

  onCellChange(day, colKey) {
    const input = document.getElementById(`cell_${day}_${colKey}`);
    if (!input) return;
    const val = input.value.trim();
    this.entries[String(day)][colKey] = val;
    this.saveData();
    this.updateRowTotal(day);
    this.updateNoSpendRow(day);
    this.renderSummary();
    this.renderNoSpendBar();
    // Check daily budget after a delay (for quick multiple entries)
    clearTimeout(this._budgetCheckTimer);
    this._budgetCheckTimer = setTimeout(() => this.checkDailyBudget(), 600);
  }

  // ── 收入项（可增删改，与「预算」卡片一致） ──
  onIncomeAmountChange(id) {
    const input = document.getElementById(`incamt_${id}`);
    const it = (this.incomeItems || []).find(x => x.id === id);
    if (!input || !it) return;
    it.amount = input.value;
    this.saveData();
    this.updateIncomeTotal();
    this.renderSummary();
  }

  onIncomeNameChange(id) {
    const input = document.getElementById(`incname_${id}`);
    const it = (this.incomeItems || []).find(x => x.id === id);
    if (!input || !it) return;
    it.name = input.value.trim() || '未命名';
    this.saveData();
    this.renderSummary();   // 汇总与小票里的名称同步，不整体重渲染以免打断输入
  }

  // 切换「加号 / 减号」：加号计入收入，减号当作扣款
  toggleIncomeSign(id) {
    const it = (this.incomeItems || []).find(x => x.id === id);
    if (!it) return;
    it.sign = (it.sign === '+') ? '-' : '+';
    this.saveData();
    this.renderTracking();
    this.renderSummary();
    this.showToast(`${it.name} 已设为 ${it.sign === '-' ? '减号（扣款）' : '加号（收入）'}`);
  }

  addIncomeItem() {
    if (!Array.isArray(this.incomeItems)) this.incomeItems = [];
    const id = 'inc_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    this.incomeItems.push({ id, name:'新项目', icon:'💰', amount:'', sign:'+' });
    this.saveData();
    this.renderTracking();
    this.renderSummary();
    this.showToast('已添加，名字可以直接改');
  }

  deleteIncomeItem(id) {
    const it = (this.incomeItems || []).find(x => x.id === id);
    if (!it) return;
    const hasVal = parseFloat(it.amount) > 0;
    const msg = hasVal
      ? `「${it.name}」里有已填金额 ${it.amount}，删除后数据将丢失。确认删除？`
      : `确认删除「${it.name}」？`;
    if (!confirm(msg)) return;
    this.incomeItems = this.incomeItems.filter(x => x.id !== id);
    this.saveData();
    this.renderTracking();
    this.renderSummary();
    this.showToast(`已删除「${it.name}」`);
  }

  // 收入合计：显示在标题行右侧（与「预算」卡片的「总预算」徽章一致）
  updateIncomeTotal() {
    const el = document.getElementById('incomeTotal');
    if (!el) return;
    const net = this.getNetIncome();
    el.innerHTML = `<span class="bt-label">💰 收入合计</span><span class="bt-value">¥${this._money(net)}</span>`;
  }

  // ── Calculations ──
  getColTotal(colKey) {
    let sum = 0;
    for (let d = 1; d <= 31; d++) {
      const v = parseFloat(this.entries[String(d)]?.[colKey]);
      if (!isNaN(v)) sum += v;
    }
    return this._round2(sum);   // 分位精度，消除浮点累加误差
  }

  getDayTotal(day) {
    let sum = 0;
    const row = this.entries[String(day)];
    if (!row) return 0;
    this.columns.forEach(c => {
      const v = parseFloat(row[c.key]);
      if (!isNaN(v)) sum += v;
    });
    return this._round2(sum);
  }

  getGrandTotal() {
    let sum = 0;
    this.columns.forEach(c => { sum += this.getColTotal(c.key); });
    return this._round2(sum);
  }

  // 收入/扣款项：来自可增删改的 incomeItems，每项带 +/− 符号（默认加号）
  _getTrackingItems() {
    const list = Array.isArray(this.incomeItems) ? this.incomeItems : [];
    return list.map(it => {
      const sign  = it.sign || '+';
      const value = parseFloat(it.amount) || 0;
      return {
        field: it.id,
        icon:  it.icon || '💰',
        label: it.name || '未命名',
        value,
        sign,
        signed: (sign === '-' ? -1 : 1) * value,
      };
    });
  }

  // 收入合计（按各自符号累加）
  getNetIncome() {
    return this._getTrackingItems().reduce((s, it) => s + it.signed, 0);
  }

  // ── No-Spend Day ──
  isNoSpendDay(day) {
    // Only mark as no-spend if the date has passed (or is today)
    const today = new Date();
    const checkDate = new Date(this.year, this.month - 1, day);
    if (checkDate > today) return false;

    const total = this.getDayTotal(day);
    // Check if any cell has a non-empty value
    const row = this.entries[String(day)] || {};
    const hasAnyInput = this.columns.some(c => {
      const v = row[c.key];
      return v !== '' && v !== null && v !== undefined;
    });

    // If nothing entered and day has passed → no-spend (user forgot to track, treat as zero)
    // If something entered but total is 0 → intentional no-spend
    return total === 0;
  }

  getNoSpendDays() {
    const days = [];
    for (let d = 1; d <= 31; d++) {
      if (this.isNoSpendDay(d)) days.push(d);
    }
    return days;
  }

  updateRowTotal(day) {
    const el = document.getElementById(`rowTotal_${day}`);
    if (!el) return;
    const total = this.getDayTotal(day);
    el.textContent = total ? this._money(total) : '';
  }

  updateNoSpendRow(day) {
    const row = document.getElementById(`dayRow_${day}`);
    if (!row) return;
    if (this.isNoSpendDay(day)) {
      row.classList.add('no-spend');
    } else {
      row.classList.remove('no-spend');
    }
  }

  exportNoSpendDays() {
    const days = this.getNoSpendDays();
    if (days.length === 0) {
      this.showToast('本月暂无无花销日');
      return;
    }
    const text = `🎉 ${this.year}年${this.month}月 无花销日 (共${days.length}天)\n\n${days.map(d => `  ${this.month}/${d}  ${this._dayOfWeek(d)}`).join('\n')}\n\n继续加油！💪`;
    // Copy to clipboard
    navigator.clipboard.writeText(text).then(() => {
      this.showToast('已复制到剪贴板！');
    }).catch(() => {
      alert(text);
    });
  }

  // ── Day Quick Entry ──
  openDayEntry(day) {
    this._entryDay = day;
    const overlay = document.getElementById('dayEntryOverlay');
    const title = document.getElementById('dayEntryTitle');
    title.textContent = `📋 快录 — ${this.month}月${day}日 ${this._dayOfWeek(day)}`;
    overlay.classList.remove('hidden');
    this._renderEntryGrid(day);
    // Reset voice state
    document.getElementById('voiceBtn').classList.remove('listening');
    document.getElementById('voiceBtn').innerHTML = '🎤 语音录入当天全部花销';
    document.getElementById('voiceResult').classList.add('hidden');
  }

  closeDayEntry() {
    document.getElementById('dayEntryOverlay').classList.add('hidden');
    this._stopListening();
    this._entryDay = null;
  }

  _renderEntryGrid(day) {
    const grid = document.getElementById('entryGrid');
    const row = this.entries[String(day)] || {};
    const notes = this.cellNotes[String(day)] || {};
    let html = '';
    this.columns.forEach(c => {
      const val = row[c.key] || '';
      const note = notes[c.key] || '';
      html += `
        <div class="entry-row">
          <span class="entry-row-label">${this._escapeHtml(c.name)}</span>
          <input class="entry-row-amount" type="number" step="0.01" inputmode="decimal"
            id="entry_amt_${c.key}" value="${this._numDisp(val)}"
            placeholder="金额"
            onfocus="app.numFocus(this)" onblur="app.numBlur(this)">
          <input class="entry-row-note" type="text"
            id="entry_note_${c.key}" value="${this._escapeHtml(note)}"
            placeholder="备注（选填）">
        </div>`;
    });
    grid.innerHTML = html;
  }

  saveDayEntry() {
    const day = this._entryDay;
    if (!day) return;
    const row = this.entries[String(day)] || {};
    const notes = {};
    let changed = false;

    this.columns.forEach(c => {
      const amtInput = document.getElementById(`entry_amt_${c.key}`);
      const noteInput = document.getElementById(`entry_note_${c.key}`);
      if (!amtInput) return;
      const newVal = amtInput.value.trim();
      const newNote = noteInput ? noteInput.value.trim() : '';
      if (row[c.key] !== newVal) { row[c.key] = newVal; changed = true; }
      if (newNote) notes[c.key] = newNote;
    });

    this.entries[String(day)] = row;
    this.cellNotes[String(day)] = Object.keys(notes).length ? notes : undefined;
    if (!this.cellNotes[String(day)]) delete this.cellNotes[String(day)];

    this.saveData();
    this.closeDayEntry();
    this.renderLedger();
    this.renderSummary();
    this.renderNoSpendBar();
    this.showToast('已保存');
    // Budget check
    clearTimeout(this._budgetCheckTimer);
    this._budgetCheckTimer = setTimeout(() => this.checkDailyBudget(), 600);
  }

  // ── Voice Input ──
  toggleVoice() {
    if (this._recognition) {
      this._stopListening();
    } else {
      this._startListening();
    }
  }

  _startListening() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      this.showToast('⚠️ 当前浏览器不支持语音输入，请用 Chrome');
      return;
    }
    this._recognition = new SpeechRecognition();
    this._recognition.lang = 'zh-CN';
    this._recognition.interimResults = true;
    this._recognition.continuous = true;
    this._recognition.maxAlternatives = 1;

    const btn = document.getElementById('voiceBtn');
    btn.classList.add('listening');
    btn.innerHTML = '🔴 正在听... 说完点我停止';

    this._recognition.onresult = (e) => {
      let text = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        text += e.results[i][0].transcript;
      }
      const resultDiv = document.getElementById('voiceResult');
      resultDiv.classList.remove('hidden');
      resultDiv.textContent = '👂 听到: ' + text;

      if (e.results[e.results.length - 1].isFinal) {
        this._parseVoiceInput(text, true);
      } else {
        this._parseVoiceInput(text, false);
      }
    };

    this._recognition.onerror = (e) => {
      if (e.error === 'no-speech') return;
      this.showToast('语音识别出错: ' + e.error);
      this._stopListening();
    };

    this._recognition.onend = () => {
      const btn2 = document.getElementById('voiceBtn');
      btn2.classList.remove('listening');
      btn2.innerHTML = '🎤 语音录入当天全部花销';
      this._recognition = null;
    };

    this._recognition.start();
  }

  _stopListening() {
    if (this._recognition) {
      try { this._recognition.stop(); } catch(e) {}
      this._recognition = null;
    }
    const btn = document.getElementById('voiceBtn');
    btn.classList.remove('listening');
    btn.innerHTML = '🎤 语音录入当天全部花销';
  }

  _parseVoiceInput(text, isFinal) {
    // Build keyword→colKey map
    const keywordMap = {};
    this.columns.forEach(c => {
      keywordMap[c.name] = c.key;
      // Add common abbreviations/aliases
      const aliases = {
        '食': ['吃', '饭', '餐', '外卖', '买菜'],
        '行': ['路费', '交通', '打车', '地铁', '公交', '车费'],
        '家用': ['家里', '家庭', '居家'],
        '生活费': ['生活'],
        '学': ['学习', '教育', '书', '课'],
        '医': ['医疗', '药', '看病', '医院'],
        '张': ['张'],
        '借': ['借出', '借给'],
      };
      const al = aliases[c.name] || [];
      al.forEach(a => { keywordMap[a] = c.key; });
    });

    // Build column name list for matching
    const colNames = this.columns.map(c => c.name);

    // Strategy: find "<category><amount>" or "<amount><category>" patterns
    // Chinese: "家用150超市" or "家用一百五超市"
    const segments = text.split(/[，。,、\s]+/).filter(s => s.trim());

    for (const seg of segments) {
      // Try to match category name first
      let matchedCol = null;
      let remaining = seg;

      // Try column names in order of length (longest first)
      const sortedCols = [...this.columns].sort((a, b) => b.name.length - a.name.length);
      for (const c of sortedCols) {
        if (seg.startsWith(c.name)) {
          matchedCol = c.key;
          remaining = seg.slice(c.name.length);
          break;
        }
      }

      // Try keyword matching
      if (!matchedCol) {
        for (const c of this.columns) {
          const aliases = {
            '食': ['吃', '饭', '餐'],
            '行': ['路费', '交通', '打车', '地铁', '公交'],
            '家用': ['家里', '居家'],
          };
          const al = aliases[c.name] || [c.name];
          for (const kw of al) {
            if (seg.includes(kw)) {
              const idx = seg.indexOf(kw);
              // Check if there's a number nearby
              const before = seg.slice(0, idx);
              const after = seg.slice(idx + kw.length);
              const numMatch = (before + after).match(/(\d+[点\.]?\d*|[一二三四五六七八九十百千万]+)/);
              if (numMatch) {
                matchedCol = c.key;
              }
            }
          }
        }
      }

      if (matchedCol && isFinal) {
        // Extract the number from remaining
        const cnNumMap = { '零':0,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10,'百':100,'千':1000,'万':10000 };
        let amount = null;
        let note = '';

        // Try Arabic number
        const arabicMatch = remaining.match(/(\d+[点\.]?\d*)/);
        if (arabicMatch) {
          amount = parseFloat(arabicMatch[0]);
          note = remaining.slice(arabicMatch.index + arabicMatch[0].length).replace(/^块|元|块钱|元钱?/, '').trim();
        } else {
          // Try Chinese number
          const cnMatch = remaining.match(/[零一二两三四五六七八九十百千万]+/);
          if (cnMatch) {
            let cn = cnMatch[0];
            // Simple Chinese number parsing
            if (cn === '十') amount = 10;
            else if (/^[一二三四五六七八九]十$/.test(cn)) amount = cnNumMap[cn[0]] * 10;
            else if (/^[一二三四五六七八九]百$/.test(cn)) amount = cnNumMap[cn[0]] * 100;
            else amount = cn.split('').reduce((s, ch, i) => {
              if (ch === '十') return s * 10;
              if (ch === '百') return s * 100;
              return s + (cnNumMap[ch] || 0);
            }, 0);
            note = remaining.slice(cnMatch.index + cnMatch[0].length).replace(/^块|元|块钱|元钱?/, '').trim();
          }
        }

        if (amount !== null) {
          document.getElementById(`entry_amt_${matchedCol}`).value = amount;
          if (note) document.getElementById(`entry_note_${matchedCol}`).value = note;
        }
      }
    }
  }

  // ── Keyboard shortcuts ──
  _handleKeydown(e) {
    if (e.key === 'Escape' && !document.getElementById('dayEntryOverlay').classList.contains('hidden')) {
      this.closeDayEntry();
    }
  }

  _dayOfWeek(day) {
    const d = new Date(this.year, this.month - 1, day);
    return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  }

  // ── Analytics ──
  setAnalyticsRange(range) {
    this.analyticsRange = range;
    this.renderAnalytics();
  }

  getAllMonthData() {
    const months = [];
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      const match = key.match(/^ledger_v2_(\d{4})_(\d{2})$/);
      if (match) {
        try {
          const raw = localStorage.getItem(key);
          const data = JSON.parse(raw);
          months.push({
            year: parseInt(match[1]),
            month: parseInt(match[2]),
            data,
          });
        } catch(e) {}
      }
    }
    // Sort newest first
    months.sort((a, b) => b.year - a.year || b.month - a.month);
    return months;
  }

  getFilteredMonths(range) {
    const all = this.getAllMonthData();
    const now = new Date();
    const thisYear = now.getFullYear();
    const thisMonth = now.getMonth() + 1;

    switch (range) {
      case '1m':
        return all.filter(m => {
          const mIdx = m.year * 12 + m.month;
          const nowIdx = thisYear * 12 + thisMonth;
          return mIdx >= nowIdx - 1 && mIdx <= nowIdx;
        });
      case '3m':
        return all.filter(m => {
          const mIdx = m.year * 12 + m.month;
          const nowIdx = thisYear * 12 + thisMonth;
          return mIdx >= nowIdx - 3 && mIdx <= nowIdx;
        });
      case '6m':
        return all.filter(m => {
          const mIdx = m.year * 12 + m.month;
          const nowIdx = thisYear * 12 + thisMonth;
          return mIdx >= nowIdx - 6 && mIdx <= nowIdx;
        });
      case 'year':
        return all.filter(m => m.year === thisYear);
      default:
        return all;
    }
  }

  renderAnalytics() {
    const months = this.getFilteredMonths(this.analyticsRange);
    const rangeLabels = { '1m':'近1月', '3m':'近3月', '6m':'近6月', 'year':'今年', 'all':'全部' };

    // Render range buttons
    document.getElementById('analyticsRange').innerHTML = Object.entries(rangeLabels)
      .map(([k, v]) => `<button class="${this.analyticsRange === k ? 'active' : ''}" onclick="app.setAnalyticsRange('${k}')">${v}</button>`)
      .join('');

    const content = document.getElementById('analyticsContent');

    if (months.length === 0) {
      content.innerHTML = '<div class="analytics-empty">暂无历史数据，开始记账后这里会显示统计分析 📊</div>';
      return;
    }

    // Aggregate: category → { total, monthCount }
    const agg = {};
    const allColKeys = new Set();
    months.forEach(m => {
      if (m.data.columns) m.data.columns.forEach(c => allColKeys.add(c.key));
    });

    // Use current columns as primary key set
    const colMap = {};
    this.columns.forEach(c => { colMap[c.key] = c; });
    // Also add previously seen columns
    months.forEach(m => {
      if (m.data.columns) m.data.columns.forEach(c => {
        if (!colMap[c.key]) colMap[c.key] = c;
      });
    });

    Object.values(colMap).forEach(c => {
      agg[c.key] = { name: c.name, total: 0, monthCount: 0 };
    });

    // Sum up
    const monthsWithData = [];
    months.forEach(m => {
      let hasData = false;
      Object.values(colMap).forEach(c => {
        const sum = this._getMonthColTotal(m.data, c.key);
        if (sum > 0) {
          agg[c.key].total += sum;
          agg[c.key].monthCount++;
          hasData = true;
        }
      });
      if (hasData) monthsWithData.push(m);
    });

    const activeMonths = monthsWithData.length || months.length;
    const grandTotal = Object.values(agg).reduce((s, v) => s + v.total, 0);

    if (grandTotal === 0) {
      content.innerHTML = '<div class="analytics-empty">所选时间范围内暂无花销记录</div>';
      return;
    }

    const maxTotal = Math.max(...Object.values(agg).map(v => v.total), 1);

    // Build bars
    let html = '';
    const sorted = Object.entries(agg)
      .filter(([, v]) => v.total > 0)
      .sort((a, b) => b[1].total - a[1].total);

    sorted.forEach(([, v]) => {
      const pct = Math.round((v.total / maxTotal) * 100);
      const sharePct = grandTotal > 0 ? Math.round((v.total / grandTotal) * 100) : 0;
      html += `
        <div class="analytics-bar-row">
          <span class="analytics-bar-label">${this._escapeHtml(v.name)}</span>
          <div class="analytics-bar-track">
            <div class="analytics-bar-fill" style="width:${pct}%">${sharePct}%</div>
          </div>
          <span class="analytics-bar-amount">¥${this._money(v.total)}</span>
          <span class="analytics-bar-avg">月均¥${this._money(v.total / activeMonths)}</span>
        </div>`;
    });

    html += `
      <div class="analytics-total">
        <span>合计（${months.length}个月 · ${activeMonths}个月有花销）</span>
        <span class="val">¥${this._money(grandTotal)}</span>
      </div>
      <div class="analytics-meta">
        ${months.map(m => `${m.year}/${m.month}`).join(' · ')}
      </div>
    `;

    content.innerHTML = html;
  }

  _getMonthColTotal(data, colKey) {
    if (!data.entries) return 0;
    let sum = 0;
    for (const row of Object.values(data.entries)) {
      const v = parseFloat(row[colKey]);
      if (!isNaN(v)) sum += v;
    }
    return sum;
  }

    this.renderTodos();
    this.renderNoSpendBar();
    this.renderLedger();
    this.renderTracking();
    this.renderAssets();
    this.renderSummary();
    this.renderAnalytics();
    this.renderBackupCard();
  }

    document.getElementById('viewCalBtn').classList.toggle('active', mode === 'calendar');

  renderBudget() {
    const grid = document.getElementById('budgetGrid');
    let html = '';

    this.columns.forEach(c => {
      html += `
        <div class="budget-item">
          <button class="del-col-btn" onclick="app.deleteColumn('${c.key}')" title="删除此类别">×</button>
          <input class="budget-name-input" id="colname_${c.key}"
            value="${this._escapeHtml(c.name)}"
            onchange="app.onColumnNameChange('${c.key}')"
            placeholder="类别名">
          <div class="budget-item-row">
            <span class="budget-prefix" title="该类别的预算金额">¥</span>

              value="${this._numDisp(c.budget)}" step="0.01" min="0" title="该类别的预算金额"

  updateTotalBudget() {
    const el = document.getElementById('budgetTotal');
    if (!el) return;
    let total = 0;
    this.columns.forEach(c => { total += parseFloat(c.budget) || 0; });
    el.innerHTML = `<span class="bt-label">📊 本月总预算</span><span class="bt-value">¥${this._money(total)}</span>`;
  }

  _escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  /* ══════════════════════════════════════════════════════════
     数字工具（v8.15）
     ── 金额精确到分（两位小数），显示智能：整数不带小数，有小数补齐两位
     ══════════════════════════════════════════════════════════ */

  // 四舍五入到分，消除浮点误差（0.1+0.2=0.30000000000000004 之类）
  _round2(n) {
    const v = Number(n);
    if (!isFinite(v)) return 0;
    return Math.round((v + Number.EPSILON) * 100) / 100;
  }

  // 金额显示：12 → "12"；12.3 → "12.30"；12.345 → "12.35"
  // 整数不显示小数（不啰嗦），有小数一律补齐两位（金额惯例）
  _money(n) {
    const v = this._round2(n);
    if (Object.is(v, -0)) return '0';
    return Number.isInteger(v) ? String(v) : v.toFixed(2);
  }

  // 输入框的显示值：0 / 空 / 非数字 一律显示为空（"点上去就是干净的"）
  _numDisp(v) {
    if (v == null) return '';
    const s = String(v).trim();
    if (s === '') return '';
    const n = Number(s);
    if (!isFinite(n) || n === 0) return '';
    return s;
  }

  // 聚焦：0 或空 → 清空（可直接输入新值）；有值 → 全选（延迟一拍，避开 mouseup 取消选区）
  numFocus(el) {
    if (!el) return;
    const raw = (el.value || '').trim();
    if (raw === '' || !isFinite(Number(raw)) || Number(raw) === 0) {
      el.value = '';
      return;
    }
    setTimeout(() => { try { el.select(); } catch (e) { /* 某些输入框不支持 select */ } }, 0);
  }

  // 失焦：规范成两位小数并落库（12 → "12"，12.3 → "12.30"，12.345 → "12.35"）
  numBlur(el) {
    if (!el) return;
    const raw = (el.value || '').trim();
    if (raw === '') { this._fireChange(el); return; }
    const n = Number(raw);
    if (!isFinite(n)) { this._fireChange(el); return; }
    const formatted = n === 0 ? '' : this._money(n);
    if (formatted !== el.value) el.value = formatted;
    this._fireChange(el);
  }

  // 手动触发 change（numBlur 改了值之后让 onchange 保存）
  _fireChange(el) {
    try {
      const ev = new Event('change', { bubbles: true });
      el.dispatchEvent(ev);
    } catch (e) {
      // 老浏览器降级：直接调 onchange
      if (typeof el.onchange === 'function') el.onchange();
    }
  }

    container.innerHTML = `
      <div class="no-spend-bar">
        <span>🟢</span>
        <span class="count">${days.length}</span>
        <span>天无花销</span>
